<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 將網頁 Title 與 apple-mobile-web-app-title 統一設定為 WalletWatch，確保 iPhone 加入主畫面時只會留 WalletWatch -->
    <title>WalletWatch</title>
    
    <!-- ==========================================
        LINE / Facebook / Social Media 社群分享卡片預覽設定 (Open Graph)
        ========================================== -->
    <meta property="og:title" content="WalletWatch">
    <meta property="og:description" content="別讓錢包破了洞，Wallet Watch 幫你盯緊每筆心動。">
    <!-- 設定傳送網址至 LINE 時，卡片上要呈現的預覽縮圖 (直接套用您的專屬 APP 圖示) -->
    <meta property="og:image" content="https://cdn.phototourl.com/free/2026-06-07-c4d4f5b3-892d-4895-a465-8178bd9246da.png">
    <meta property="og:type" content="website">
    
    <!-- ==========================================
        iOS (iPhone / iPad) 加入主畫面專用 PWA 增強設定
        ========================================== -->
    <!-- 1. 設定主畫面 APP 名稱 -->
    <meta name="apple-mobile-web-app-title" content="WalletWatch">
    
    <!-- 2. 開啟全螢幕 Web App 模式 (隱藏 Safari 網址列，宛如原生 APP) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <!-- 3. 設定頂部狀態列顏色 (使狀態列背景與主題完美融合) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <!-- 4. iPhone 專用高解析度 Apple Touch Icon (180x180) -->
    <link rel="apple-touch-icon" sizes="180x180" href="https://cdn.phototourl.com/free/2026-06-07-c4d4f5b3-892d-4895-a465-8178bd9246da.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700..950;1,700..950&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;950&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #EBE7E0; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translate(-50%, -10px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
        .animate-fade-in-down {
            animation: fadeInDown 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-6 md:p-12 text-[#362C24]">

    <!-- 擬真 iPhone 完美機身外殼 -->
    <div class="w-full max-w-[430px] h-[932px] sm:h-[880px] bg-[#FAF7F2] sm:rounded-[50px] shadow-[0_25px_60px_-15px_rgba(74,60,49,0.15)] border-0 sm:border-[10px] border-[#2C302E] flex flex-col relative overflow-hidden">
        
        <!-- 頂部劉海安全區 -->
        <div class="hidden sm:flex absolute top-0 left-0 right-0 h-9 bg-transparent z-40 items-center justify-between px-8 text-xs font-black text-[#8A7B70] pointer-events-none">
            <span>9:41</span>
            <div class="w-28 h-5 bg-[#2C302E] rounded-b-2xl mx-auto -mt-0.5"></div>
            <div class="flex items-center gap-1">
                <span>📶</span>
                <span>🔋</span>
            </div>
        </div>

        <!-- 劉海頂部安全距離補償 -->
        <div class="h-6 sm:h-9 bg-transparent shrink-0"></div>

        <!-- Toast 提示條 -->
        <div id="toast" class="hidden fixed top-14 left-1/2 -translate-x-1/2 w-[90%] max-w-[360px] z-50 flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-xl border backdrop-blur-md bg-white/95 text-[#362C24] border-[#E6DFD5] animate-fade-in-down">
            <!-- 動態插入 Toast 內容 -->
        </div>

        <!-- 經典深栗米砂色滾動主內容區 -->
        <div id="main-scroll-container" class="flex-1 overflow-y-auto px-5 pb-24 pt-2 no-scrollbar">
            
            <!-- 精緻頂部 App 標題列與雙下拉選單 -->
            <div class="flex items-center justify-between mb-4">
                <div>
                    <!-- 年份與月份快速下拉選單 (2026 to 2036) -->
                    <div class="flex items-center gap-1 bg-white border border-[#E6DFD5] px-2.5 py-1 rounded-full shadow-sm text-[10px] font-black text-[#4A3C31] uppercase tracking-[0.05em] mb-1">
                        <select id="header-year-select" onchange="handleYearChange(this.value)" class="bg-transparent font-black cursor-pointer focus:outline-none pr-0.5 text-[10px] text-[#4A3C31]">
                            <!-- JavaScript 將動態生成 2026-2036 -->
                        </select>
                        <span class="text-[#8A7B70] font-bold">/</span>
                        <select id="header-month-select" onchange="handleMonthChange(this.value)" class="bg-transparent font-black cursor-pointer focus:outline-none pl-0.5 text-[10px] text-[#4A3C31]">
                            <!-- JavaScript 將動態生成 01-12 -->
                        </select>
                    </div>
                    <h2 class="font-serif italic text-4xl font-black text-[#4A3C31] tracking-tight leading-none pt-1">
                        WalletWatch
                    </h2>
                </div>
                
                <!-- 快捷備份按鈕 -->
                <div class="flex gap-2">
                    <button onclick="switchTab('settings')" class="w-9 h-9 rounded-full bg-white border border-[#E6DFD5] flex items-center justify-center text-xs shadow-sm hover:scale-105 active:scale-95 transition" title="換機移轉">
                        📲
                    </button>
                    <button onclick="handleExportData()" class="w-9 h-9 rounded-full bg-white border border-[#E6DFD5] flex items-center justify-center text-xs shadow-sm hover:scale-105 active:scale-95 transition" title="即時備份">
                        💾
                    </button>
                </div>
            </div>

            <!-- 視圖呈現容器 -->
            <div id="view-container"></div>
        </div>

        <!-- 彈出式修改面板 (Slide-up Edit Sheet) -->
        <div id="edit-modal" class="hidden absolute inset-0 bg-black/60 z-50 flex items-end justify-center transition-opacity duration-300">
            <!-- 彈出修改欄位內容 -->
        </div>

        <!-- 擬真 iPhone 觸控條安全區 -->
        <div class="hidden sm:block absolute bottom-1.5 left-1/2 -translate-x-1/2 w-32 h-1 bg-[#2C302E] rounded-full pointer-events-none z-40"></div>

        <!-- 底部 iOS 經典扁平雙色調圖標導覽列 (平級對齊按鈕) -->
        <nav class="absolute bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg border-t border-[#E6DFD5]/80 py-3 shadow-lg z-30 px-3 flex justify-around items-center">
            
            <!-- 1. 歷史明細 -->
            <button onclick="switchTab('history')" id="tab-history" class="flex flex-col items-center gap-1 transition-all duration-150 cursor-pointer text-slate-400 font-bold">
                <div class="tab-icon-wrapper p-1.5 rounded-full"></div>
                <span class="text-[9px]">歷史明細</span>
            </button>

            <!-- 2. 記一筆 -->
            <button onclick="switchTab('add')" id="tab-add" class="flex flex-col items-center gap-1 transition-all duration-150 cursor-pointer text-slate-400 font-bold">
                <div class="tab-icon-wrapper p-1.5 rounded-full"></div>
                <span class="text-[9px]">記一筆</span>
            </button>

            <!-- 3. 儀表板 (已對齊平鋪) -->
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="flex flex-col items-center gap-1 transition-all duration-150 cursor-pointer text-slate-400 font-bold">
                <div class="tab-icon-wrapper p-1.5 rounded-full"></div>
                <span class="text-[9px]">儀表板</span>
            </button>

            <!-- 4. 分類管理 -->
            <button onclick="switchTab('categories')" id="tab-categories" class="flex flex-col items-center gap-1 transition-all duration-150 cursor-pointer text-slate-400 font-bold">
                <div class="tab-icon-wrapper p-1.5 rounded-full"></div>
                <span class="text-[9px]">分類管理</span>
            </button>

            <!-- 5. 移轉中心 -->
            <button onclick="switchTab('settings')" id="tab-settings" class="flex flex-col items-center gap-1 transition-all duration-150 cursor-pointer text-slate-400 font-bold">
                <div class="tab-icon-wrapper p-1.5 rounded-full"></div>
                <span class="text-[9px]">移轉中心</span>
            </button>
        </nav>

    </div>

    <!-- ==========================================
        JavaScript 核心邏輯
        ========================================== -->
    <script>
        // --- 預設與初始資料 ---
        const DEFAULT_CURRENCIES = [
            { code: 'TWD', symbol: 'NT$', rateToBase: 1, name: '新台幣' },
            { code: 'USD', symbol: '$', rateToBase: 31.0, name: '美金' },
            { code: 'JPY', symbol: '¥', rateToBase: 0.21, name: '日圓' },
            { code: 'EUR', symbol: '€', rateToBase: 33.5, name: '歐元' }
        ];

        const DEFAULT_CREDIT_CARDS = [
            { id: 'card-1', name: '中信 LINE Pay 卡', bank: '中國信託' },
            { id: 'card-2', name: '富邦 J 卡', bank: '中國信託' },
            { id: 'card-3', name: '國泰 CUBE 卡', bank: '國泰世華' }
        ];

        const DEFAULT_CATEGORIES = {
            expense: {
                '飲食': { icon: 'dining', color: 'bg-[#F5EBE6] text-[#6E5A4F] border-[#E8DDD5]', sub: [{ name: '早餐', icon: '🍳' }, { name: '午餐', icon: '🍱' }, { name: '晚餐', icon: '🍜' }, { name: '下午茶', icon: '☕' }] },
                '交通': { icon: 'transport', color: 'bg-[#EFEFEE] text-[#555555] border-[#E0E0DF]', sub: [{ name: '捷運/公車', icon: '🚇' }, { name: '計程車', icon: '🚕' }, { name: '加油', icon: '⛽' }] },
                '娛樂': { icon: 'entertainment', color: 'bg-[#F0EAE1] text-[#7A6B58] border-[#E2D9CD]', sub: [{ name: '電影', icon: '🍿' }, { name: '遊戲/網購', icon: '🎮' }, { name: '旅行', icon: '✈️' }] },
                '醫藥': { icon: 'medical', color: 'bg-[#ECEDE8] text-[#5B604D] border-[#DDDFD5]', sub: [{ name: '看診', icon: '🏥' }, { name: '保健品', icon: '🌿' }] },
                '服裝': { icon: 'clothing', color: 'bg-[#F3EBE9] text-[#7E5C54] border-[#E6D7D3]', sub: [{ name: '衣服', icon: '👚' }, { name: '鞋包', icon: '👟' }] },
                '美妝': { icon: 'beauty', color: 'bg-[#F5ECEF] text-[#865F6C] border-[#E9D7DC]', sub: [{ name: '保養品', icon: '🧴' }, { name: '彩妝', icon: '💅' }] },
                '其他': { icon: 'others', color: 'bg-[#F4F1EC] text-[#6C6962] border-[#E5E1D8]', sub: [{ name: '日常雜貨', icon: '🧹' }, { name: '手機費', icon: '📱' }] }
            },
            income: {
                '收入': { icon: 'income', color: 'bg-[#EAF2ED] text-[#5A8F76] border-[#D5E6DC]', sub: [{ name: '正職薪資', icon: '💼' }, { name: '兼職/外快', icon: '🪙' }, { name: '投資回報', icon: '📈' }] }
            }
        };

        function getInitialTransactions() {
            return [
                { id: 'tx-1', date: '2026-06-01', type: 'income', majorCategory: '收入', subCategory: '正職薪資', amount: 45000, currency: 'TWD', paymentMethod: '現金', note: '本月薪資入帳' },
                { id: 'tx-2', date: '2026-06-07', type: 'expense', majorCategory: '飲食', subCategory: '下午茶', amount: 110, currency: 'TWD', paymentMethod: '現金', note: '與朋友聚餐咖啡' },
                { id: 'tx-3', date: '2026-06-07', type: 'expense', majorCategory: '交通', subCategory: '捷運/公車', amount: 110, currency: 'TWD', paymentMethod: '現金', note: '通勤加值' },
                { id: 'tx-4', date: '2026-06-05', type: 'expense', majorCategory: '服裝', subCategory: '衣服', amount: 1200, currency: 'TWD', paymentMethod: '國泰 CUBE 卡', note: '買夏日防曬外套' },
                { id: 'tx-5', date: '2026-06-06', type: 'expense', majorCategory: '美妝', subCategory: '保養品', amount: 1500, currency: 'TWD', paymentMethod: '中信 LINE Pay 卡', note: '保濕精華液' },
                { id: 'tx-pre-1', date: '2026-05-10', type: 'expense', majorCategory: '飲食', subCategory: '晚餐', amount: 3500, currency: 'TWD', paymentMethod: '富邦 J 卡', stroke: '1', note: '高檔燒肉慶生' },
                { id: 'tx-pre-2', date: '2026-05-15', type: 'expense', majorCategory: '娛樂', subCategory: '旅行', amount: 8000, currency: 'TWD', paymentMethod: '國泰 CUBE 卡', note: '兩天一夜小旅行' },
                { id: 'tx-pre-3', date: '2026-05-01', type: 'income', majorCategory: '收入', subCategory: '正職薪資', amount: 45000, currency: 'TWD', paymentMethod: '現金', note: '上月薪資入帳' },
                { id: 'tx-pre2-1', date: '2026-04-05', type: 'expense', majorCategory: '飲食', subCategory: '午餐', amount: 4200, currency: 'TWD', paymentMethod: '現金', note: '日常飲食累計' },
                { id: 'tx-pre2-2', date: '2026-04-18', type: 'expense', majorCategory: '美妝', subCategory: '彩妝', amount: 2600, currency: 'TWD', paymentMethod: '中信 LINE Pay 卡', note: '專櫃粉底液' }
            ];
        }

        // --- 全域應用狀態 ---
        window.state = {
            transactions: JSON.parse(localStorage.getItem('ios_budget_transactions')) || getInitialTransactions(),
            categories: JSON.parse(localStorage.getItem('ios_budget_categories')) || DEFAULT_CATEGORIES,
            creditCards: JSON.parse(localStorage.getItem('ios_budget_credit_cards')) || DEFAULT_CREDIT_CARDS,
            currencies: JSON.parse(localStorage.getItem('ios_budget_currencies')) || DEFAULT_CURRENCIES,
            baseCurrencyCode: 'TWD',
            currentTab: 'dashboard',
            selectedMonth: '2026-06',
            
            // 記帳狀態 (支援算式)
            txType: 'expense',
            txMajorCategory: '飲食',
            txSubCategory: '早餐',
            txAmount: '',
            txCurrency: 'TWD',
            txPaymentMethod: '現金',
            txDate: '2026-06-07',
            txNote: '',

            // 修改交易狀態
            editingTx: null,

            // 分類建立與修改狀態
            editingMajorType: 'expense',
            editingMajorCat: '飲食',
            newSubName: '',
            newSubIcon: '✨',

            // 信用卡與匯率移轉狀態
            newCardName: '',
            newCardBank: '',
            showMigrationGuide: false,
            importString: ''
        };

        // --- 儲存狀態至 LocalStorage ---
        function saveState() {
            localStorage.setItem('ios_budget_transactions', JSON.stringify(window.state.transactions));
            localStorage.setItem('ios_budget_categories', JSON.stringify(window.state.categories));
            localStorage.setItem('ios_budget_credit_cards', JSON.stringify(window.state.creditCards));
            localStorage.setItem('ios_budget_currencies', JSON.stringify(window.state.currencies));
        }

        // --- 安全算式解析運算器 ---
        function safeEval(str) {
            if (!str) return 0;
            // 過濾並轉化運算元
            let sanitized = str.replace(/✕/g, '*').replace(/÷/g, '/');
            // 只允許數字、點、加減乘除與空白
            if (!/^[0-9\s.+\-*/]*$/.test(sanitized)) return null;
            try {
                // 安全防沙箱執行
                let res = new Function(`return (${sanitized})`)();
                if (typeof res === 'number' && isFinite(res)) {
                    return res;
                }
                return null;
            } catch(e) {
                return null;
            }
        }

        // --- 計算與轉換 Utility 函式 ---
        function convertToBase(amount, fromCurrencyCode) {
            const fromCurr = window.state.currencies.find(c => c.code === fromCurrencyCode);
            const baseCurrency = window.state.currencies.find(c => c.code === window.state.baseCurrencyCode) || window.state.currencies[0];
            if (!fromCurr || !baseCurrency) return amount;
            return (amount * fromCurr.rateToBase) / baseCurrency.rateToBase;
        }

        // --- 格式化金額輸出 ---
        function formatAmount(amount, currencyCode, showSymbol = true) {
            const curr = window.state.currencies.find(c => c.code === currencyCode);
            const symbol = curr ? curr.symbol : '$';
            const formatted = Number(amount).toLocaleString('zh-TW', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
            return showSymbol ? `${symbol} ${formatted}` : formatted;
        }

        // --- 格式化基本金額 ---
        function formatBaseAmount(amount) {
            return formatAmount(amount, window.state.baseCurrencyCode);
        }

        function getAmountFontSize(length) {
            length = length || 1;
            if (length <= 6) return '3.2rem';
            const dynamicSize = 3.2 - (length - 6) * 0.15;
            return `${Math.max(1.4, dynamicSize)}rem`;
        }

        // --- Toast 提示功能 ---
        window.showToast = function(message, type = 'success') {
            const toastEl = document.getElementById('toast');
            const icon = type === 'success' ? '✨' : type === 'error' ? '⚡' : '💡';
            toastEl.innerHTML = `
                <span class="text-base">${icon}</span>
                <p class="text-xs font-black">${message}</p>
            `;
            toastEl.classList.remove('hidden');
            setTimeout(() => {
                toastEl.classList.add('hidden');
            }, 3500);
        };

        // --- 靜態與動態 SVG 範本 ---
        function getCategoryIcon(name, className = "w-5 h-5") {
            switch (name) {
                case '飲食':
                    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="${className}">
                              <path d="M18 8h1a4 4 0 0 1 0 8h-1" />
                              <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z" fill="currentColor" fill-opacity="0.15" />
                              <line x1="6" y1="2" x2="6" y2="4" />
                              <line x1="10" y1="2" x2="10" y2="4" />
                              <line x1="14" y1="2" x2="14" y2="4" />
                            </svg>`;
                case '交通':
                    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="${className}">
                              <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2" fill="currentColor" fill-opacity="0.15" />
                              <circle cx="7" cy="17" r="2" />
                              <circle cx="17" cy="17" r="2" />
                            </svg>`;
                case '娛樂':
                    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="${className}">
                              <rect x="2" y="6" width="20" height="12" rx="2" fill="currentColor" fill-opacity="0.15" />
                              <path d="M6 12h4M8 10v4M15 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2ZM18 11a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" />
                            </svg>`;
                case '醫藥':
                    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="${className}">
                              <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z" fill="currentColor" fill-opacity="0.15" />
                              <path d="m8.5 8.5 7 7" stroke-width="1.8" />
                            </svg>`;
                case '服裝':
                    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="${className}">
                              <path d="M20.38 3.46L16 2a4 4 0 0 0-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l1.08 5.4a2 2 0 0 0 1.94 1.41H7v8a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-8h1.7a2 2 0 0 0 1.94-1.41l1.08-5.4a2 2 0 0 0-1.34-2.23Z" fill="currentColor" fill-opacity="0.15" />
                            </svg>`;
                case '美妝':
                    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="${className}">
                              <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" fill="currentColor" fill-opacity="0.2" />
                            </svg>`;
                case '其他':
                    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="${className}">
                              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" fill="currentColor" fill-opacity="0.15" />
                              <path d="M3.27 7 12 12.01 20.73 7M12 22.08V12" />
                            </svg>`;
                case '收入':
                    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="${className}">
                              <circle cx="12" cy="12" r="10" fill="currentColor" fill-opacity="0.2" />
                              <line x1="12" y1="8" x2="12" y2="16" />
                              <path d="M16 10H10a2 2 0 0 0 0 4h4a2 2 0 0 1 0 4H8" />
                            </svg>`;
                default:
                    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="${className}">
                              <circle cx="12" cy="12" r="10" />
                              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                              <line x1="12" y1="17" x2="12.01" y2="17" />
                            </svg>`;
            }
        }

        function getTabIcon(name, active, stroke, className = "w-6 h-6 transition-colors") {
            const strokeColor = stroke || (active ? "#4A3C31" : "#A39385");
            const fillOpacity = active ? "0.2" : "0.05";
            switch (name) {
                case 'dashboard':
                    return `<svg viewBox="0 0 24 24" fill="none" stroke="${strokeColor}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="${className}">
                              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="currentColor" fill-opacity="${fillOpacity}" />
                              <polyline points="9 22 9 12 15 12 15 22" />
                            </svg>`;
                case 'add':
                    return `<svg viewBox="0 0 24 24" fill="none" stroke="${strokeColor}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="${className}">
                              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                              <path d="M18.5 2.5a2.12 2.12 0 1 1 3 3L12 15l-4 1 1-4Z" fill="currentColor" fill-opacity="${fillOpacity}" />
                            </svg>`;
                case 'history':
                    return `<svg viewBox="0 0 24 24" fill="none" stroke="${strokeColor}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="${className}">
                              <rect x="3" y="4" width="18" height="18" rx="2" fill="currentColor" fill-opacity="${fillOpacity}" />
                              <line x1="16" y1="2" x2="16" y2="6" />
                              <line x1="8" y1="2" x2="8" y2="6" />
                              <line x1="3" y1="10" x2="21" y2="10" />
                              <path d="m9 16 2 2 4-4" />
                            </svg>`;
                case 'categories':
                    return `<svg viewBox="0 0 24 24" fill="none" stroke="${strokeColor}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="${className}">
                              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" fill="currentColor" fill-opacity="${fillOpacity}" />
                              <circle cx="12" cy="14" r="2" />
                            </svg>`;
                case 'settings':
                    return `<svg viewBox="0 0 24 24" fill="none" stroke="${strokeColor}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="${className}">
                              <rect x="5" y="2" width="14" height="20" rx="2" fill="currentColor" fill-opacity="${fillOpacity}" />
                              <line x1="12" y1="18" x2="12.01" y2="18" />
                              <path d="m15 6-3-3-3 3" />
                              <path d="M12 3v11" />
                            </svg>`;
                default:
                    return '';
            }
        }

        // --- 初始化年份與月份下拉選單 ---
        function initHeaderSelectors() {
            const yearSelect = document.getElementById('header-year-select');
            const monthSelect = document.getElementById('header-month-select');
            
            yearSelect.innerHTML = '';
            for (let y = 2026; y <= 2036; y++) {
                yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
            }

            monthSelect.innerHTML = '';
            for (let m = 1; m <= 12; m++) {
                const monthStr = String(m).padStart(2, '0');
                monthSelect.innerHTML += `<option value="${monthStr}">${monthStr}月</option>`;
            }

            const [currentYear, currentMonth] = window.state.selectedMonth.split('-');
            yearSelect.value = currentYear;
            monthSelect.value = currentMonth;
        }

        window.handleYearChange = function(year) {
            const currentMonth = window.state.selectedMonth.split('-')[1];
            window.state.selectedMonth = `${year}-${currentMonth}`;
            showToast(`已載入 ${year} 年記帳資料`, 'info');
            render();
        };

        window.handleMonthChange = function(month) {
            const currentYear = window.state.selectedMonth.split('-')[0];
            window.state.selectedMonth = `${currentYear}-${month}`;
            showToast(`已切換至 ${month} 月明細`, 'success');
            render();
        };

        // --- 核心渲染引擎 ---
        function render() {
            // 更新導覽列啟動狀態
            const tabs = ['dashboard', 'history', 'add', 'categories', 'settings'];
            tabs.forEach(tab => {
                const button = document.getElementById(`tab-${tab}`);
                if (!button) return; // 安全保護
                const wrapper = button.querySelector('.tab-icon-wrapper');
                if (!wrapper) return; // 安全保護
                
                if (tab === window.state.currentTab) {
                    button.className = "flex flex-col items-center gap-1 transition-all duration-150 cursor-pointer scale-105 font-black text-[#4A3C31]";
                    wrapper.className = "p-1.5 rounded-full bg-[#4A3C31]/10 tab-icon-wrapper";
                    wrapper.innerHTML = getTabIcon(tab, true);
                } else {
                    button.className = "flex flex-col items-center gap-1 transition-all duration-150 cursor-pointer text-slate-400 font-bold";
                    wrapper.className = "p-1.5 rounded-full bg-transparent tab-icon-wrapper";
                    wrapper.innerHTML = getTabIcon(tab, false);
                }
            });

            // 確保選單值正確同步
            const [selectedY, selectedM] = window.state.selectedMonth.split('-');
            document.getElementById('header-year-select').value = selectedY;
            document.getElementById('header-month-select').value = selectedM;

            // 渲染特定 Tabs
            const viewContainer = document.getElementById('view-container');
            const activeTab = window.state.currentTab;

            if (activeTab === 'dashboard') {
                renderDashboard(viewContainer);
            } else if (activeTab === 'add') {
                renderAdd(viewContainer);
            } else if (activeTab === 'history') {
                renderHistory(viewContainer);
            } else if (activeTab === 'categories') {
                renderCategories(viewContainer);
            } else if (activeTab === 'settings') {
                renderSettings(viewContainer);
            }

            // 同步修改視窗 (Edit Sheet)
            renderEditModal();
        }

        // ==========================================
        // TAB 1: 儀表板首頁 (DASHBOARD)
        // ==========================================
        function renderDashboard(container) {
            const filtered = window.state.transactions.filter(tx => tx.date.startsWith(window.state.selectedMonth));
            
            // 1. 本月統計數字
            let expenseTotal = 0;
            let incomeTotal = 0;
            filtered.forEach(tx => {
                const converted = convertToBase(tx.amount, tx.currency);
                if (tx.type === 'expense') {
                    expenseTotal += converted;
                } else {
                    incomeTotal += converted;
                }
            });
            const balance = incomeTotal - expenseTotal;

            // 2. 歷史月度消費對比
            const trend = {};
            window.state.transactions.forEach(tx => {
                if (tx.type === 'expense') {
                    const month = tx.date.substring(0, 7); // "YYYY-MM"
                    const converted = convertToBase(tx.amount, tx.currency);
                    trend[month] = (trend[month] || 0) + converted;
                }
            });
            
            const monthlyTrendStats = Object.entries(trend)
                .map(([month, amount]) => ({ month, amount }))
                .sort((a, b) => b.month.localeCompare(a.month))
                .slice(0, 5);

            const maxMonthlySpend = monthlyTrendStats.length > 0 ? Math.max(...monthlyTrendStats.map(m => m.amount), 1) : 1;

            // 3. 類別佔比
            const summary = {};
            Object.keys(window.state.categories.expense).forEach(cat => {
                summary[cat] = { amount: 0, percentage: 0, colorClass: window.state.categories.expense[cat].color, icon: window.state.categories.expense[cat].icon };
            });

            filtered.forEach(tx => {
                if (tx.type === 'expense') {
                    const converted = convertToBase(tx.amount, tx.currency);
                    if (summary[tx.majorCategory]) {
                        summary[tx.majorCategory].amount += converted;
                    }
                }
            });

            const categoryExpenses = Object.entries(summary)
                .map(([name, data]) => ({ name, ...data }))
                .filter(c => c.amount > 0)
                .sort((a, b) => b.amount - a.amount);

            let totalCategorySpend = categoryExpenses.reduce((sum, c) => sum + c.amount, 0);
            categoryExpenses.forEach(c => {
                if (totalCategorySpend > 0) {
                    c.percentage = Math.round((c.amount / totalCategorySpend) * 100);
                }
            });

            // SVG 甜甜圈圓餅圖生成
            let accumPercentage = 0;
            const colors = ['#4A3C31', '#8A7B70', '#BCA38D', '#D2C5B4', '#A39385', '#E6DFD5'];
            const segments = categoryExpenses.map((cat, idx) => {
                const percentage = cat.percentage;
                const start = accumPercentage;
                accumPercentage += percentage;
                return {
                    name: cat.name,
                    percentage,
                    start,
                    color: colors[idx % colors.length]
                };
            });

            let circlesHTML = `<circle cx="18" cy="18" r="15.915" fill="none" stroke="#FAF7F2" stroke-width="4"></circle>`;
            segments.forEach(segment => {
                const strokeDasharray = `${segment.percentage} ${100 - segment.percentage}`;
                const strokeDashoffset = 100 - segment.start;
                circlesHTML += `<circle cx="18" cy="18" r="15.915" fill="none" stroke="${segment.color}" stroke-width="4" stroke-dasharray="${strokeDasharray}" stroke-dashoffset="${strokeDashoffset}" class="transition-all duration-500"></circle>`;
            });

            const spendingRate = incomeTotal > 0 ? Math.round((expenseTotal / incomeTotal) * 100) : 100;

            // 4. 信用卡累積消費
            const cardTotals = {};
            window.state.creditCards.forEach(card => {
                cardTotals[card.name] = { id: card.id, bank: card.bank, amount: 0, txCount: 0 };
            });
            let creditCardTotal = 0;
            filtered.forEach(tx => {
                if (tx.type === 'expense' && tx.paymentMethod !== '現金') {
                    const converted = convertToBase(tx.amount, tx.currency);
                    if (cardTotals[tx.paymentMethod]) {
                        cardTotals[tx.paymentMethod].amount += converted;
                        cardTotals[tx.paymentMethod].txCount += 1;
                        creditCardTotal += converted;
                    }
                }
            });
            const activeCards = Object.entries(cardTotals).map(([name, data]) => ({ name, ...data }));

            // --- 歷史對比 HTML 區塊 ---
            let trendRowsHTML = '';
            if (monthlyTrendStats.length === 0) {
                trendRowsHTML = `
                    <div class="text-center py-6 text-[#8A7B70]">
                        <span class="text-2xl">📊</span>
                        <p class="text-[10px] font-black mt-1">尚無跨月消費數據</p>
                    </div>`;
            } else {
                monthlyTrendStats.forEach(stat => {
                    const barPercentage = Math.round((stat.amount / maxMonthlySpend) * 100);
                    const isCurrentSelected = stat.month === window.state.selectedMonth;
                    const displayMonth = stat.month.replace('-', ' / ');
                    
                    trendRowsHTML += `
                        <div onclick="selectTrendMonth('${stat.month}')" class="group p-2.5 rounded-2xl border transition-all cursor-pointer flex flex-col gap-1.5 ${isCurrentSelected ? 'bg-[#FAF7F2] border-[#4A3C31]' : 'bg-transparent border-transparent hover:bg-slate-50'}">
                            <div class="flex items-center justify-between text-xs font-black">
                                <span class="${isCurrentSelected ? 'text-[#4A3C31]' : 'text-[#8A7B70]'} flex items-center gap-1.5">
                                    ${displayMonth}
                                    ${isCurrentSelected ? '<span class="text-[8px] bg-[#4A3C31] text-[#FAF7F2] px-1.5 py-0.25 rounded font-black">當前選擇</span>' : ''}
                                </span>
                                <span class="text-[#4A3C31]">${formatBaseAmount(stat.amount)}</span>
                            </div>
                            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                                <div class="h-full rounded-full transition-all duration-500 ${isCurrentSelected ? 'bg-[#4A3C31]' : 'bg-[#BCA38D] group-hover:bg-[#8A7B70]'}" style="width: ${Math.max(4, barPercentage)}%"></div>
                            </div>
                        </div>`;
                });
            }

            // --- 類別佔比 HTML 區塊 ---
            let categoryListHTML = '';
            if (categoryExpenses.length === 0) {
                categoryListHTML = `
                    <div class="text-center py-8 text-[#8A7B70] w-full">
                        <span class="text-3xl">☕</span>
                        <p class="text-xs mt-1.5 font-bold">本月尚無任何支出記錄</p>
                    </div>`;
            } else {
                categoryListHTML = `
                    <div class="flex items-center gap-4 w-full">
                        <div class="w-24 h-24 shrink-0 relative">
                            <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                                ${circlesHTML}
                            </svg>
                            <div class="absolute inset-0 flex flex-col items-center justify-center">
                                <span class="text-[9px] font-black text-[#8A7B70] leading-none">支出率</span>
                                <span class="text-sm font-black text-[#4A3C31]">${spendingRate}%</span>
                            </div>
                        </div>
                        <div class="flex-1 space-y-2">`;
                categoryExpenses.forEach((cat, idx) => {
                    const colorLabel = colors[idx % colors.length];
                    categoryListHTML += `
                            <div class="flex items-center justify-between text-xs">
                                <div class="flex items-center gap-1.5 font-bold text-[#8A7B70]">
                                    <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${colorLabel}"></span>
                                    <span>${cat.name}</span>
                                </div>
                                <span class="font-black text-[#362C24]">${cat.percentage}%</span>
                            </div>`;
                });
                categoryListHTML += `</div></div>`;
            }

            // --- 信用卡累積消費 HTML ---
            let cardsHTML = '';
            activeCards.forEach(card => {
                cardsHTML += `
                    <div class="flex items-center justify-between p-2.5 rounded-2xl bg-[#FAF7F2] border border-[#E6DFD5]/50">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-[#4A3C31] to-[#8A7B70] text-white flex items-center justify-center text-sm font-bold shadow-sm">💳</div>
                            <div>
                                <p class="font-black text-xs text-[#362C24]">${card.name}</p>
                                <p class="text-[9px] font-bold text-[#8A7B70]">${card.bank} • ${card.txCount} 筆</p>
                            </div>
                        </div>
                        <span class="font-black text-sm text-[#4A3C31]">${formatBaseAmount(card.amount)}</span>
                    </div>`;
            });
            if (window.state.creditCards.length === 0) {
                cardsHTML = `<p class="text-center text-xs font-bold text-[#8A7B70] py-2">尚未綁定任何信用卡</p>`;
            }

            // --- 最近明細 HTML ---
            let recentHTML = '';
            filtered.slice(0, 3).forEach(tx => {
                const majorDetails = window.state.categories[tx.type]?.[tx.majorCategory] || { icon: '❓', color: 'bg-gray-100 text-gray-500' };
                recentHTML += `
                    <div class="relative flex items-center justify-between p-2 rounded-2xl bg-[#FAF7F2] hover:bg-white border border-[#E6DFD5]/30 transition group">
                        <span class="absolute -left-[18.5px] top-1/2 -translate-y-1/2 w-2.5 h-2.5 rounded-full bg-[#8A7B70] border-2 border-white shadow-sm"></span>
                        <div class="flex items-center gap-2.5">
                            <span class="w-9 h-9 rounded-full flex items-center justify-center text-sm ${majorDetails.color} border shadow-sm shrink-0">
                                ${getCategoryIcon(tx.majorCategory)}
                            </span>
                            <div>
                                <div class="flex items-center gap-1.5">
                                    <p class="font-black text-xs text-[#362C24]">${tx.subCategory || tx.majorCategory}</p>
                                    <span class="text-[8px] bg-white border border-[#E6DFD5] px-1 py-0.25 rounded font-bold text-[#8A7B70]">${tx.paymentMethod}</span>
                                </div>
                                <p class="text-[9px] font-bold text-[#8A7B70] mt-0.5">${tx.date} ${tx.note ? `• ${tx.note}` : ''}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="text-right">
                                <p class="font-black text-xs ${tx.type === 'expense' ? 'text-[#4A3C31]' : 'text-[#5A8F76]'}">
                                    ${tx.type === 'expense' ? '-' : '+'}${formatAmount(tx.amount, tx.currency)}
                                </p>
                                ${tx.currency !== window.state.baseCurrencyCode ? `<p class="text-[8px] font-bold text-[#8A7B70]">≈ ${formatBaseAmount(convertToBase(tx.amount, tx.currency))}</p>` : ''}
                            </div>
                            <div class="flex items-center gap-1">
                                <button onclick="triggerEdit('${tx.id}')" class="w-6 h-6 rounded-lg bg-white border border-[#E6DFD5] text-[#8A7B70] hover:text-[#4A3C31] flex items-center justify-center text-[10px] cursor-pointer font-bold transition">✏️</button>
                                <button onclick="deleteTx('${tx.id}')" class="w-6 h-6 rounded-lg bg-white border border-rose-100 text-rose-300 hover:text-rose-600 flex items-center justify-center text-[10px] cursor-pointer font-bold transition">✕</button>
                            </div>
                        </div>
                    </div>`;
            });
            if (filtered.length === 0) {
                recentHTML = `<p class="text-center text-xs font-bold text-[#8A7B70] py-4">本月尚未登錄任何帳目</p>`;
            }

            // --- 總體整合組裝 ---
            container.innerHTML = `
                <div class="space-y-5">
                    
                    <!-- 核心餘額卡片 -->
                    <div class="relative p-5 rounded-3xl bg-white border border-[#E6DFD5] shadow-[0_4px_20px_rgba(74,60,49,0.03)] overflow-hidden">
                        <p class="text-[10px] font-black text-[#8A7B70] uppercase tracking-widest text-center mb-1">
                            目前帳戶餘額 (${window.state.baseCurrencyCode === 'TWD' ? '新台幣' : window.state.baseCurrencyCode})
                        </p>
                        <h3 class="text-3.5xl font-serif italic font-black text-[#4A3C31] text-center tracking-tight mb-2">
                            ${formatBaseAmount(balance)}
                        </h3>
                        <div class="grid grid-cols-2 gap-2 border-t border-[#FAF7F2] pt-3 text-center">
                            <div>
                                <span class="text-[9px] font-black text-[#8A7B70] block">本月總收入</span>
                                <span class="text-xs font-black text-[#5A8F76]">${formatBaseAmount(incomeTotal)}</span>
                            </div>
                            <div class="border-l border-[#FAF7F2]">
                                <span class="text-[9px] font-black text-[#8A7B70] block">本月總支出</span>
                                <span class="text-xs font-black text-[#4A3C31]">${formatBaseAmount(expenseTotal)}</span>
                            </div>
                        </div>
                    </div>

                    <!-- 歷史月度消費對比看板 -->
                    <div class="bg-white rounded-3xl p-4 border border-[#E6DFD5] shadow-[0_4px_20px_rgba(74,60,49,0.02)]">
                        <div class="flex items-center justify-between mb-3.5 border-b border-[#FAF7F2] pb-2">
                            <h3 class="text-xs font-black text-[#8A7B70] uppercase tracking-wider flex items-center gap-1.5">
                                <span>📈</span> 歷史月度消費對比
                            </h3>
                            <span class="text-[9px] bg-[#FAF7F2] border border-[#E6DFD5] px-2 py-0.5 rounded-full font-black text-[#8A7B70]">僅統計支出</span>
                        </div>
                        <div class="space-y-3">${trendRowsHTML}</div>
                    </div>

                    <!-- 圓餅類別佔比分析 -->
                    <div class="bg-white rounded-3xl p-4 border border-[#E6DFD5] shadow-[0_4px_20px_rgba(74,60,49,0.02)]">
                        <h3 class="text-xs font-black text-[#8A7B70] uppercase tracking-wider mb-3.5 flex items-center gap-1.5">
                            <span>📊</span> 本月支出類別占比
                        </h3>
                        <div class="flex items-center gap-4">${categoryListHTML}</div>
                    </div>

                    <!-- 信用卡消費統計 -->
                    <div class="bg-white rounded-3xl p-4 border border-[#E6DFD5] shadow-[0_4px_20px_rgba(74,60,49,0.02)]">
                        <div class="flex items-center justify-between mb-3 border-b border-[#FAF7F2] pb-2">
                            <h3 class="text-xs font-black text-[#8A7B70] uppercase tracking-wider flex items-center gap-1.5">
                                <span>💳</span> 信用卡累積消費金額
                            </h3>
                        </div>
                        <div class="space-y-2.5">${cardsHTML}</div>
                    </div>

                    <!-- 最近帳目明細 -->
                    <div class="bg-white rounded-3xl p-4 border border-[#E6DFD5] shadow-[0_4px_20px_rgba(74,60,49,0.02)]">
                        <div class="flex items-center justify-between mb-3">
                            <h3 class="text-xs font-black text-[#8A7B70] uppercase tracking-wider">本月最近交易</h3>
                            <button onclick="switchTab('history')" class="text-[10px] font-black text-[#4A3C31] hover:underline">查看全部明細</button>
                        </div>
                        <div class="relative pl-3 border-l-2 border-[#E6DFD5] space-y-4 py-1">${recentHTML}</div>
                    </div>

                </div>`;
        }

        window.selectTrendMonth = function(month) {
            window.state.selectedMonth = month;
            showToast(`已載入 ${month.replace('-', ' 年 ')} 月明細`, 'success');
            render();
        };

        // ==========================================
        // TAB 2: 記一筆 (ADD) (升級：專業計算機鍵盤)
        // ==========================================
        function renderAdd(container) {
            // 根據選定類型與大分類，載入相應小分類列表
            const currentCategories = window.state.categories[window.state.txType] || {};
            const majorCatObj = currentCategories[window.state.txMajorCategory] || { sub: [] };
            
            // 支出/收入頁籤
            let typeSelectorHTML = `
                <div class="flex bg-[#FFF5EE]/50 p-1 rounded-2xl border border-[#E6DFD5]">
                    <button type="button" onclick="setAddTxType('expense')" class="flex-1 py-2.5 rounded-xl text-xs font-black transition-all ${window.state.txType === 'expense' ? 'bg-[#4A3C31] text-white shadow-md' : 'text-[#8A7B70] hover:text-[#4A3C31]'}">💸 支出消費</button>
                    <button type="button" onclick="setAddTxType('income')" class="flex-1 py-2.5 rounded-xl text-xs font-black transition-all ${window.state.txType === 'income' ? 'bg-[#4A3C31] text-white shadow-md' : 'text-[#8A7B70] hover:text-[#4A3C31]'}">💰 收入進帳</button>
                </div>`;

            // 大類按鈕清單
            let majorGridHTML = '';
            Object.keys(currentCategories).forEach(catName => {
                const catObj = currentCategories[catName];

        window.setAddTxType = function(type) {

            render();
        };

            window.state.txSubCategory = sub;
            render();
        };

            window.state.txCurrency = currency;
            render();
        };

            window.state.txDate = dateStr;
        };

            window.state.txPaymentMethod = method;
        };

        window.setAddTxNote = function(note) {
            window.state.txNote = note;
        };

        // --- 鍵盤輸入邏輯（支援數學算式組合）---
        window.handleCalcInput = function(value) {
            let current = window.state.txAmount.toString();
            const operators = ['+', '-', '*', '/'];
            
            if (value === 'backspace') {
                current = current.length <= 1 ? '' : current.slice(0, -1);
            } else if (value === 'clear') {
                current = '';
            } else if (value === '=') {
                let res = safeEval(current);
                if (res !== null) {
                    current = Number(res.toFixed(2)).toString();
                } else {
                    showToast('算式不完整，無法計算！', 'error');
                    return;
                }
            } else if (operators.includes(value)) {
                if (current === '') {
                    if (value === '-') current = '-';
                    else return;
                } else {
                    let lastChar = current.slice(-1);
                    if (operators.includes(lastChar)) {
                        current = current.slice(0, -1) + value;
                    } else {
                        current += value;
                    }
                }
            } else if (value === '.') {
                let segments = current.split(/[\+\-\*\/]/);
                let activeSegment = segments[segments.length - 1] || '';
                if (activeSegment.includes('.')) return;
                
                if (current === '' || operators.includes(current.slice(-1))) {
                    current += '0.';
                } else {
                    current += '.';
                }
            } else {
                if (current === '0') {
                    current = value.toString();
                } else {
                    current += value.toString();
                }
            }
            window.state.txAmount = current;
            render();
        };

        // --- 確認送出記帳（支援自動計算結果）---
        window.submitAddTx = function() {
            let finalAmountStr = window.state.txAmount.toString();
            let evaluated = safeEval(finalAmountStr);
            
            if (finalAmountStr === '' || evaluated === null) {
                showToast('算式不完整或格式錯誤！請重新確認。', 'error');
                return;
            }
            
            if (evaluated <= 0) {
                showToast('記帳金額必須大於 0 元！', 'error');
                return;
            }

            if (!window.state.txSubCategory) {
                showToast('請選擇合適的小分類！', 'error');
                return;
            }

            const newTx = {
                id: `tx-${Date.now()}`,
                date: window.state.txDate,
                type: window.state.txType,
                majorCategory: window.state.txMajorCategory,
                subCategory: window.state.txSubCategory,
                amount: Number(evaluated.toFixed(2)),
                currency: window.state.txCurrency,
                paymentMethod: window.state.txType === 'income' ? '現金' : window.state.txPaymentMethod,
                note: window.state.txNote.trim()
            };

            window.state.transactions.unshift(newTx);
            saveState();
            
            window.state.txAmount = '';
            window.state.txNote = '';
            showToast('交易已成功登錄！');
            
            window.state.currentTab = 'dashboard';
            render();
        };

                return;
            }

            const index = window.state.transactions.findIndex(t => t.id === window.state.editingTx.id);
            if (index !== -1) {
                window.state.transactions[index] = {
                    ...window.state.transactions[index],
                    type: window.state.editingTx.type,
                    majorCategory: window.state.editingTx.majorCategory,
                    subCategory: window.state.editingTx.subCategory,
                    amount: editAmount,

        // 備份、匯入與轉移代碼操作
        // ==========================================
        window.handleExportData = function() {
            const dataPack = {
                transactions: window.state.transactions,
                categories: window.state.categories,
                creditCards: window.state.creditCards,
                currencies: window.state.currencies,
                baseCurrencyCode: window.state.baseCurrencyCode,
                version: 'ios-v2.0',
                exportedAt: new Date().toISOString()
            };
            
            const dataStr = JSON.stringify(dataPack, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const exportFileName = `智繪記帳_iPhone備份_${new Date().toISOString().split('T')[0]}.json`;
            
            const link = document.createElement('a');
            link.setAttribute('href', dataUri);
            link.setAttribute('download', exportFileName);
            link.click();
            showToast('備份完成！已成功導出 JSON 檔', 'success');
        };

        window.handleImportFile = function(e) {
            const fileReader = new FileReader();
            if (e.target.files && e.target.files[0]) {
                fileReader.readAsText(e.target.files[0], "UTF-8");
                fileReader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.transactions && parsed.categories) {
                            window.state.transactions = parsed.transactions;
                            window.state.categories = parsed.categories;
                            if (parsed.creditCards) window.state.creditCards = parsed.creditCards;
                            if (parsed.currencies) window.state.currencies = parsed.currencies;
                            if (parsed.baseCurrencyCode) window.state.baseCurrencyCode = parsed.baseCurrencyCode;
                            saveState();
                            showToast('備份匯入成功！已還原所有歷史記錄', 'success');
                            render();
                        } else {
                            showToast('無效的備份檔案格式', 'error');
                        }
                    } catch (err) {
                        showToast('解析備份時發生錯誤', 'error');
                    }
                };
            }
        };

        window.copyTransferCode = function() {
            const dataPack = {
                transactions: window.state.transactions,
                categories: window.state.categories,
                creditCards: window.state.creditCards,
                currencies: window.state.currencies,
                baseCurrencyCode: window.state.baseCurrencyCode
            };
            try {
                const code = btoa(encodeURIComponent(JSON.stringify(dataPack)));
                fallbackCopy(code);
            } catch (e) {
                showToast('資料過大，建議直接使用 JSON 備份檔導出', 'error');
            }
        };

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast('已複製轉移代碼！可在新手機貼上還原', 'success');
            } catch (err) {
                showToast('無法複製代碼，請手動複製面板。', 'error');
            }
            document.body.removeChild(textArea);
        }

        window.submitImportCode = function() {
            const importString = document.getElementById('import-code-input').value.trim();
            if (!importString) {
                showToast('請先貼上資料傳送代碼', 'error');
                return;
            }
            try {
                const decoded = JSON.parse(decodeURIComponent(atob(importString)));
                if (decoded.transactions && decoded.categories) {
                    window.state.transactions = decoded.transactions;
                    window.state.categories = decoded.categories;
                    if (decoded.creditCards) window.state.creditCards = decoded.creditCards;
                    if (decoded.currencies) window.state.currencies = decoded.currencies;
                    if (decoded.baseCurrencyCode) window.state.baseCurrencyCode = decoded.baseCurrencyCode;
                    saveState();
                    document.getElementById('import-code-input').value = '';
                    showToast('代碼還原成功！資料已完全導入', 'success');
                    render();
                } else {
                    showToast('代碼結構不符，請確認完整性', 'error');
                }
            } catch (err) {
                showToast('代碼解析失敗，格式不符或有缺失', 'error');
            }
        };

        // ==========================================
        // 核心切換頁籤與初始化
        // ==========================================
        window.switchTab = function(tab) {
            window.state.currentTab = tab;
            document.getElementById('main-scroll-container').scrollTop = 0;
            render();
        };

        window.onload = function() {
            initHeaderSelectors();
            render();
        };
    </script>
</body>
</html>
