        window.toggleMigrationGuide = function() {
            window.state.showMigrationGuide = !window.state.showMigrationGuide;
            render();
        };

        window.submitAddCard = function(event) {
            event.preventDefault();
            const name = document.getElementById('card-name-input').value.trim();
            const bank = document.getElementById('card-bank-input').value.trim() || '未指定銀行';

            if (!name) {
                showToast('請輸入信用卡名稱！', 'error');
                return;
            }
            if (window.state.creditCards.some(c => c.name === name)) {
                showToast('已有同名的信用卡！', 'error');
                return;
            }

            const newCard = { id: `card-${Date.now()}`, name, bank };
            window.state.creditCards.push(newCard);
            saveState();
            showToast(`已成功綁定信用卡「${name}」`);
            render();
        };

        window.deleteCard = function(id, name) {
            window.state.creditCards = window.state.creditCards.filter(c => c.id !== id);
            saveState();
            showToast(`已解綁信用卡「${name}」`, 'info');
            render();
        };

        window.submitSaveRates = function(event) {
            event.preventDefault();
            window.state.currencies = window.state.currencies.map(c => {
                if (c.code === 'TWD') return c;
                const inputVal = document.getElementById('rate-input-' + c.code).value;
                return { ...c, rateToBase: parseFloat(inputVal) || c.rateToBase };
            });
            saveState();
            showToast('匯率設定已成功更新！');
            render();
        };

        // ==========================================
        // 修改彈出視窗 (SLIDE-UP MODAL)
        // ==========================================
        function renderEditModal() {
            const modal = document.getElementById('edit-modal');
            const tx = window.state.editingTx;
            if (!tx) {
                modal.classList.add('hidden');
                return;
            }

            const currentCategories = window.state.categories[tx.type] || {};
            const majorCatObj = currentCategories[tx.majorCategory] || { sub: [] };

            let editMajorsGrid = '';
            Object.keys(currentCategories).forEach(catName => {
                const catObj = currentCategories[catName];
                const isSelected = tx.majorCategory === catName;
                editMajorsGrid += `
                    <button type="button" onclick="setEditMajorCategory('${catName}')" class="py-1.5 rounded-xl border transition-all flex flex-col items-center justify-center gap-0.5 ${isSelected ? 'border-[#4A3C31] bg-white scale-105 shadow-sm font-black text-[#4A3C31]' : 'border-[#E6DFD5]/30 bg-white/60 text-slate-500 font-bold'}">
                        <span class="w-6 h-6 rounded-full border flex items-center justify-center ${catObj.color} text-xs shrink-0">
                            ${getCategoryIcon(catName, "w-3.5 h-3.5")}
                        </span>
                        <span class="text-[9px] font-black">${catName}</span>
                    </button>`;
            });

            let editSubsPills = '';
            editSubsPills += `<div class="flex flex-wrap gap-1.5">`;
            majorCatObj.sub.forEach(subObj => {
                const isSelected = tx.subCategory === subObj.name;
                editSubsPills += `
                    <button type="button" onclick="setEditSubCategory('${subObj.name}')" class="px-2.5 py-1 rounded-full text-[10px] font-black border transition-all flex items-center gap-1 shadow-sm ${isSelected ? 'border-[#4A3C31] bg-[#4A3C31] text-[#FAF7F2]' : 'border-slate-100 bg-white text-slate-600'}">
                        <span>${subObj.icon}</span>
                        <span>${subObj.name}</span>
                    </button>`;
            });
            editSubsPills += `</div>`;

            let currencyOpts = '';
            window.state.currencies.forEach(c => {
                currencyOpts += `<option value="${c.code}" ${c.code === tx.currency ? 'selected' : ''}>${c.code}</option>`;
            });

            let paymentOpts = `<option value="現金" ${tx.paymentMethod === '現金' ? 'selected' : ''}>💵 現金 / 帳戶</option>`;
            window.state.creditCards.forEach(card => {
                paymentOpts += `<option value="${card.name}" ${card.name === window.state.txPaymentMethod ? 'selected' : ''}>💳 ${card.name}</option>`;
            });

            // 💡 記憶核心優化：檢查 modal 目前是否已是開啟狀態（即不含有 hidden 類別）
            const isAlreadyVisible = !modal.classList.contains('hidden');

            modal.innerHTML = `
                <div class="w-full bg-[#FAF7F2] rounded-t-[36px] max-h-[85%] overflow-y-auto p-6 border-t border-[#E6DFD5] space-y-5 ${isAlreadyVisible ? '' : 'animate-slide-up'} shadow-[0_-10px_35px_rgba(74,60,49,0.25)]">
                    
                    <div class="flex items-center justify-between border-b border-[#E6DFD5] pb-3">
                        <h3 class="font-serif italic text-2xl font-black text-[#4A3C31]">修改交易明細</h3>
                        <button type="button" onclick="closeEditModal()" class="w-8 h-8 rounded-full bg-white border border-[#E6DFD5] flex items-center justify-center text-xs font-black shadow-sm cursor-pointer hover:scale-105 active:scale-95 transition">✕</button>
                    </div>

                    <form onsubmit="submitSaveEdit(event)" class="space-y-4">
                        
                        <div class="flex bg-[#FFF5EE]/50 p-1 rounded-2xl border border-[#E6DFD5]">
                            <button type="button" onclick="setEditTxType('expense')" class="flex-1 py-2.5 rounded-xl text-xs font-black transition-all ${tx.type === 'expense' ? 'bg-[#4A3C31] text-white shadow-md' : 'text-[#8A7B70] hover:text-[#4A3C31]'}">💸 支出消費</button>
                            <button type="button" onclick="setEditTxType('income')" class="flex-1 py-2.5 rounded-xl text-xs font-black transition-all ${tx.type === 'income' ? 'bg-[#4A3C31] text-white shadow-md' : 'text-[#8A7B70] hover:text-[#4A3C31]'}">💰 收入進帳</button>
                        </div>

                        <div class="space-y-1">
                            <span class="text-[10px] font-black text-[#8A7B70] uppercase tracking-widest block">修改大分類</span>
                            <div class="grid grid-cols-4 gap-1.5">${editMajorsGrid}</div>
                        </div>

                        <div class="space-y-1">
                            <span class="text-[10px] font-black text-[#8A7B70] uppercase tracking-widest block">修改小分類</span>
                            ${editSubsPills}
                        </div>

                        <div class="grid grid-cols-3 gap-2">
                            <div class="space-y-1">
                                <span class="text-[10px] font-black text-[#8A7B70] block">幣別</span>
                                <!-- 💡 核心修改：將高度設定為 h-9，讓上下邊緣與右側的金額輸入框完全一致，保證視覺比例完美工整 -->
                                <select id="edit-currency-select" class="w-full h-9 px-2 bg-white border border-[#E6DFD5] rounded-xl text-xs font-black text-[#4A3C31] focus:outline-none" onchange="setEditTxCurrency(this.value)">
                                    ${currencyOpts}
                                </select>
                            </div>
                            <div class="col-span-2 space-y-1">
                                <span class="text-[10px] font-black text-[#8A7B70] block">金額</span>
                                <!-- 💡 核心修改：將高度設定為 h-9，讓上下邊緣與左側的幣別下拉選單完全一致，保證視覺比例完美工整 -->
                                <input type="number" required step="any" id="edit-amount-input" placeholder="修改金額" value="${tx.amount}" class="w-full h-9 px-3 bg-white border border-[#E6DFD5] rounded-xl text-xs font-black text-[#4A3C31] focus:ring-1 focus:ring-[#4A3C31] focus:outline-none">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div class="space-y-1">
                                <span class="text-[10px] font-black text-[#8A7B70] block">交易日期</span>
                                <!-- 💡 核心修改：將高度固定為 h-9，移除原有的 py 襯距，使高度與右側的管道完美對齊一致 -->
                                <input type="date" required id="edit-date-input" value="${tx.date}" class="w-full h-9 px-2.5 bg-white border border-[#E6DFD5] rounded-xl text-xs font-black text-slate-700 focus:outline-none">
                            </div>
                            ${tx.type === 'expense' ? `
                            <div class="space-y-1">
                                <span class="text-[10px] font-black text-[#8A7B70] block">支付管道</span>
                                <!-- 💡 核心修改：將高度固定為 h-9，移除原有的 py 襯距，使高度與左側的日期完美對齊一致 -->
                                <select id="edit-payment-select" class="w-full h-9 px-2.5 bg-white border border-[#E6DFD5] rounded-xl text-xs font-black text-slate-700 focus:outline-none">
                                    ${paymentOpts}
                                </select>
                            </div>` : `
                            <div class="space-y-1">
                                <span class="text-[10px] font-black text-[#8A7B70] block">管道</span>
                                <!-- 💡 核心修改：將高度固定為 h-9，加入 flex items-center 垂直置中文字，使其上下邊框與左側的日期輸入框完全一致 -->
                                <div class="w-full h-9 px-2.5 bg-[#FAF7F2] border border-[#E6DFD5] rounded-xl text-xs font-black text-slate-400 flex items-center">現金入帳</div>
                            </div>`}
                        </div>

                        <div class="space-y-1">
                            <span class="text-[10px] font-black text-[#8A7B70] block">備註欄</span>
                            <input type="text" id="edit-note-input" placeholder="點擊修改備註..." value="${tx.note || ''}" class="w-full px-3 py-2 bg-white border border-[#E6DFD5] rounded-xl text-xs font-bold text-slate-700 focus:outline-none focus:ring-1 focus:ring-[#4A3C31]">
                        </div>

                        <div class="grid grid-cols-2 gap-3 pt-2">
                            <button type="button" onclick="closeEditModal()" class="w-full py-2.5 border border-[#E6DFD5] bg-white rounded-2xl font-black text-[#8A7B70] text-xs shadow-sm hover:bg-slate-50 active:scale-95 transition cursor-pointer">放棄修改</button>
                            <button type="submit" class="w-full py-2.5 bg-[#4A3C31] text-white rounded-2xl font-black text-xs shadow-lg hover:bg-[#342921] active:scale-95 transition cursor-pointer">儲存更新</button>
                        </div>
                    </form>
                </div>`;
            modal.classList.remove('hidden');
        }

        window.triggerEdit = function(id) {
            const tx = window.state.transactions.find(t => t.id === id);
            if (tx) {
                window.state.editingTx = JSON.parse(JSON.stringify(tx));
                render();
            }
        };

        window.closeEditModal = function() {
            window.state.editingTx = null;
            render();
        };

        window.setEditTxType = function(type) {
            window.state.editingTx.type = type;
            const keys = Object.keys(window.state.categories[type]);
            window.state.editingTx.majorCategory = keys[0] || '';
            const subs = window.state.categories[type][window.state.editingTx.majorCategory]?.sub || [];
            window.state.editingTx.subCategory = subs[0]?.name || '';
            render();
        };

        window.setEditMajorCategory = function(catName) {
            window.state.editingTx.majorCategory = catName;
            const subs = window.state.categories[window.state.editingTx.type][catName]?.sub || [];
            window.state.editingTx.subCategory = subs[0]?.name || '';
            render();
        };

        window.setEditSubCategory = function(subName) {
            window.state.editingTx.subCategory = subName;
            render();
        };

        window.setEditTxCurrency = function(currency) {
            window.state.editingTx.currency = currency;
        };

        window.submitSaveEdit = function(event) {
            event.preventDefault();
            const editAmountInput = parseFloat(document.getElementById('edit-amount-input').value);
            if (isNaN(editAmountInput) || editAmountInput <= 0) {
                showToast('請輸入有效的金額！', 'error');
                return;
            }

            const index = window.state.transactions.findIndex(t => t.id === window.state.editingTx.id);
            if (index !== -1) {
                // 如果修改後的貨幣為 TWD，強制將輸入值四捨五入為整數
                let targetAmount = editAmountInput;
                const selectedCurrency = document.getElementById('edit-currency-select').value;
                if (selectedCurrency === 'TWD') {
                    targetAmount = Math.round(editAmountInput);
                }

                window.state.transactions[index] = {
                    ...window.state.transactions[index],
                    type: window.state.editingTx.type,
                    majorCategory: window.state.editingTx.majorCategory,
                    subCategory: window.state.editingTx.subCategory,
                    amount: targetAmount,
                    currency: selectedCurrency,
                    paymentMethod: window.state.editingTx.type === 'income' ? '現金' : document.getElementById('edit-payment-select').value,
                    date: document.getElementById('edit-date-input').value,
                    note: document.getElementById('edit-note-input').value.trim()
                };
                saveState();
                showToast('交易明細已更新儲存！');
            }

            window.state.editingTx = null;
            render();
        };

        window.deleteTx = function(id) {
            window.state.transactions = window.state.transactions.filter(t => t.id !== id);
            saveState();
            showToast('明細已順利刪除', 'info');
            render();
        };

        // 💡 解決刪除小分類未定義之核心函式（升級為彈出式「修改名稱與代表符」與「確認刪除」雙效機制）
        window.deleteSubCategory = function(type, major, subName) {
            const modal = document.getElementById('sub-action-modal');
            if (!modal) return;

            const currentSubs = window.state.categories[type]?.[major]?.sub || [];
            const subObj = currentSubs.find(s => s.name === subName) || { icon: '✨', name: subName };

            // 💡 核心修改：將高度固定為 h-9，讓上下邊緣完全一致
            modal.innerHTML = `
                <div class="w-full max-w-[320px] bg-[#FAF7F2] rounded-t-[28px] sm:rounded-[28px] p-6 border-t sm:border border-[#E6DFD5] shadow-[0_10px_35px_rgba(74,60,49,0.25)] space-y-5 animate-slide-up mx-auto">
                    <div class="flex items-center justify-between border-b border-[#E6DFD5] pb-2">
                        <h4 class="font-serif italic text-base font-black text-[#4A3C31]">小分類設定</h4>
                        <button type="button" onclick="closeSubActionModal()" class="w-6 h-6 rounded-full bg-white border border-[#E6DFD5] flex items-center justify-center text-[10px] font-black shadow-sm transition active:scale-95 cursor-pointer">✕</button>
                    </div>
                    
                    <div class="space-y-1.5">
                        <span class="text-[10px] font-black text-[#8A7B70] uppercase tracking-widest block">修改圖示與名稱</span>
                        <div class="flex gap-2">
                            <input type="text" id="sub-reicon-input" value="${subObj.icon}" maxLength="2" class="w-12 h-9 text-center bg-white border border-[#E6DFD5] rounded-xl text-sm font-black focus:outline-none focus:ring-1 focus:ring-[#4A3C31]" placeholder="圖示">
                            <!-- 💡 核心修改：將高度設定為 h-9，讓上下邊緣與左邊的圖示輸入框完全一致 -->
                            <input type="text" id="sub-rename-input" value="${subName}" class="w-full h-9 px-3 bg-white border border-[#E6DFD5] rounded-xl text-[#362C24] text-xs font-bold focus:outline-none focus:ring-1 focus:ring-[#4A3C31]">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2 pt-1">
                        <button type="button" onclick="submitRenameSubCategory('${type}', '${major}', '${subName}')" class="py-2.5 bg-[#4A3C31] hover:bg-[#342921] text-white font-black text-xs rounded-xl shadow-sm transition active:scale-95 cursor-pointer">儲存修改</button>
                        <button type="button" onclick="submitDeleteSubCategory('${type}', '${major}', '${subName}')" class="py-2.5 bg-rose-500 hover:bg-rose-600 text-white font-black text-xs rounded-xl shadow-sm transition active:scale-95 cursor-pointer">確認刪除</button>
                    </div>
                    
                    <button type="button" onclick="closeSubActionModal()" class="w-full py-2 bg-white border border-[#E6DFD5] text-[#8A7B70] hover:text-[#4A3C31] font-black text-xs rounded-xl transition active:scale-95 cursor-pointer">取消</button>
                </div>
            `;
            modal.classList.remove('hidden');
        };

        window.closeSubActionModal = function() {
            const modal = document.getElementById('sub-action-modal');
            if (modal) modal.classList.add('hidden');
        };

        window.submitRenameSubCategory = function(type, major, oldName) {
            const newName = document.getElementById('sub-rename-input').value.trim();
            const newIcon = document.getElementById('sub-reicon-input').value.trim() || '✨';
            if (!newName) {
                showToast('請輸入小分類名稱！', 'error');
                return;
            }

            const catObj = window.state.categories[type]?.[major];
            if (!catObj) return;

            // 檢查是否重複
            if (newName !== oldName && catObj.sub.some(s => s.name === newName)) {
                showToast('已有同名的小分類！', 'error');
                return;
            }

            // 更新小分類名稱與代表圖
            const subIndex = catObj.sub.findIndex(s => s.name === oldName);
            if (subIndex !== -1) {
                catObj.sub[subIndex].name = newName;
                catObj.sub[subIndex].icon = newIcon;
            }

            // 同步關聯更新所有包含該小分類的歷史交易明細，確保過去資料完好
            window.state.transactions = window.state.transactions.map(tx => {
                if (tx.type === type && tx.majorCategory === major && tx.subCategory === oldName) {
                    return { ...tx, subCategory: newName };
                }
                return tx;
            });

            saveState();
            closeSubActionModal();
            showToast(`小分類已成功更新為「${newIcon} ${newName}」`);
            render();
        };

        window.submitDeleteSubCategory = function(type, major, subName) {
            const currentSubs = window.state.categories[type]?.[major]?.sub || [];
            window.state.categories[type][major].sub = currentSubs.filter(s => s.name !== subName);
            saveState();
            closeSubActionModal();
            showToast(`小分類「${subName}」已順利刪除`, 'info');
            render();
        };

        // 💡 新增分類管理相關缺失的核心處理函式 (修正輸入、切換與新增時產生的未定義錯誤)
        window.setCategoriesEditType = function(val) {
            window.state.editingMajorType = val;
            const keys = Object.keys(window.state.categories[val] || {});
            window.state.editingMajorCat = keys[0] || '';
            render();
        };

        // 💡 補回綁定於下拉選單切換之事件函式
        window.setCategoriesEditMajor = function(val) {
            window.state.editingMajorCat = val;
            render();
        };

        window.setNewSubName = function(val) {
            window.state.newSubName = val;
        };

        window.setNewSubIcon = function(val) {
            window.state.newSubIcon = val;
            render();
        };

        window.submitAddSub = function(event) {
            event.preventDefault();
            const type = window.state.editingMajorType;
            const major = window.state.editingMajorCat;
            const name = window.state.newSubName.trim();
            const icon = window.state.newSubIcon.trim();

            if (!name) {
                showToast('請輸入小分類名稱！', 'error');
                return;
            }
            if (!icon) {
                showToast('請指定代表符！', 'error');
                return;
            }

            const catObj = window.state.categories[type]?.[major];
            if (!catObj) {
                showToast('找不到對應的大分類！', 'error');
                return;
            }

            if (catObj.sub.some(s => s.name === name)) {
                showToast('已有同名的小分類！', 'error');
                return;
            }

            catObj.sub.push({ name, icon });
            saveState();
            showToast(`已成功新增小分類「${name}」`);
            
            // 清空輸入框並重新渲染
            window.state.newSubName = '';
            render();
        };

        // ==========================================
        // 備份、匯入與轉移代碼操作
        // ==========================================
        window.handleExportData = function() {
            const dataPack = {
                transactions: window.state.transactions,
                categories: window.state.categories,
                creditCards: window.state.creditCards,
                currencies: window.state.currencies,
                baseCurrencyCode: window.state.baseCurrencyCode,
                version: 'ios-v2.0',
                exportedAt: new Date().toISOString()
            };
            
            const dataStr = JSON.stringify(dataPack, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const exportFileName = `WalletWatch_iPhone備份_${new Date().toISOString().split('T')[0]}.json`;
            
            const link = document.createElement('a');
            link.setAttribute('href', dataUri);
            link.setAttribute('download', exportFileName);
            link.click();
            showToast('備份完成！已成功導出 JSON 檔', 'success');
        };

        window.handleImportFile = function(e) {
            const fileReader = new FileReader();
            if (e.target.files && e.target.files[0]) {
                fileReader.readAsText(e.target.files[0], "UTF-8");
                fileReader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.transactions && parsed.categories) {
                            window.state.transactions = parsed.transactions;
                            window.state.categories = parsed.categories;
                            if (parsed.creditCards) window.state.creditCards = parsed.creditCards;
                            if (parsed.currencies) window.state.currencies = parsed.currencies;
                            if (window.state.baseCurrencyCode) window.state.baseCurrencyCode = parsed.baseCurrencyCode;
                            saveState();
                            showToast('備份匯入成功！已還原所有歷史記錄', 'success');
                            render();
                        } else {
                            showToast('無效的備份檔案格式', 'error');
                        }
                    } catch (err) {
                        showToast('解析備份時發生錯誤', 'error');
                    }
                };
            }
        };

        window.copyTransferCode = function() {
            const dataPack = {
                transactions: window.state.transactions,
                categories: window.state.categories,
                creditCards: window.state.creditCards,
                currencies: window.state.currencies,
                baseCurrencyCode: window.state.baseCurrencyCode
            };
            try {
                const code = btoa(encodeURIComponent(JSON.stringify(dataPack)));
                fallbackCopy(code);
            } catch (e) {
                showToast('資料過大，建議直接使用 JSON 備份檔導出', 'error');
            }
        };

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast('已複製轉移代碼！可在新手機貼上還原', 'success');
            } catch (err) {
                showToast('無法複製代碼，請手動複製面板。', 'error');
            }
            document.body.removeChild(textArea);
        }

        window.submitImportCode = function() {
            const importStringVal = document.getElementById('import-code-input').value.trim();
            if (!importStringVal) {
                showToast('請先貼上資料轉移代碼', 'error');
                return;
            }
            try {
                const decoded = JSON.parse(decodeURIComponent(atob(importStringVal)));
                if (decoded.transactions && decoded.categories) {
                    window.state.transactions = decoded.transactions;
                    window.state.categories = decoded.categories;
                    if (decoded.creditCards) window.state.creditCards = decoded.creditCards;
                    if (decoded.currencies) window.state.currencies = decoded.currencies;
                    if (window.state.baseCurrencyCode) window.state.baseCurrencyCode = decoded.baseCurrencyCode;
                    saveState();
                    document.getElementById('import-code-input').value = '';
                    showToast('代碼還原成功！資料已完全導入', 'success');
                    render();
                } else {
                    showToast('代碼結構不符，請確認完整性', 'error');
                }
            } catch (err) {
                showToast('代碼解析失敗，格式不符或有缺失', 'error');
            }
        };

        // ==========================================
        // 核心切換頁籤與初始化
        // ==========================================
        window.switchTab = function(tab) {
            window.state.currentTab = tab;
            render(); // 1. 先執行重繪，讓 DOM 產生新分頁內容的 HTML
            
            const scrollContainer = document.getElementById('main-scroll-container');
            if (scrollContainer) {
                scrollContainer.scrollTop = 0; // 2. 立即將滾動高度歸零
                
                // 3. 雙重保險：在 20毫秒後再次將 scrollTop 強制歸零
                // 徹底解決 iOS Safari / Standalone PWA 模式下在切換頁面時產生的渲染空白與高度定位卡死 Bug
                setTimeout(function() {
                    scrollContainer.scrollTop = 0;
                }, 20);
            }
        };

        // 💡 補回遺漏的 initHeaderSelectors 函式定義
        function initHeaderSelectors() {
            const yearSelect = document.getElementById('header-year-select');
            const monthSelect = document.getElementById('header-month-select');
            if (!yearSelect || !monthSelect) return;
            
            yearSelect.innerHTML = '';
            for (let y = 2026; y <= 2036; y++) {
                yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
            }

            monthSelect.innerHTML = '';
            for (let m = 1; m <= 12; m++) {
                const monthStr = String(m).padStart(2, '0');
                monthSelect.innerHTML += `<option value="${monthStr}">${monthStr}月</option>`;
            }

            const [currentYear, currentMonth] = window.state.selectedMonth.split('-');
            yearSelect.value = currentYear;
            monthSelect.value = currentMonth;
        }

        window.onload = function() {
            // 升級快補丁：如果使用者先前有 LocalStorage 快取，自動將「居家」植入到「其他」的左邊，避免新功能無法顯示！
            try {
                let savedCats = localStorage.getItem('ios_budget_categories');
                if (savedCats) {
                    let parsed = JSON.parse(savedCats);
                    if (parsed.expense && !parsed.expense['居家']) {
                        const newExpense = {};
                        Object.entries(parsed.expense).forEach(([key, val]) => {
                            if (key === '其他') {
                                newExpense['居家'] = {
                                    icon: 'home',
                                    color: 'bg-[#F2ECE4] text-[#735A42] border-[#E4D9CE]',
                                    sub: [
                                        { name: '房租/房貸', icon: '🏠' },
                                        { name: '水電瓦斯', icon: '⚡' },
                                        { name: '居家修繕', icon: '🛠️' },
                                        { name: '家具家飾', icon: '🛋️' }
                                    ]
                                };
                            }
                            newExpense[key] = val;
                        });
                        parsed.expense = newExpense;
                        window.state.categories = parsed;
                        localStorage.setItem('ios_budget_categories', JSON.stringify(parsed));
                    }
                }
            } catch (e) {
                console.error("Failed to upgrade categories", e);
            }

            // 💡 韓元幣別自動整合與資料快取相容補丁 (解決 2026 年新幣別載入問題)
            try {
                let savedCurrs = localStorage.getItem('ios_budget_currencies');
                if (savedCurrs) {
                    let parsed = JSON.parse(savedCurrs);
                    if (!parsed.some(c => c.code === 'KRW')) {
                        parsed.push({ code: 'KRW', symbol: '₩', rateToBase: 0.024, name: '韓元' });
                        window.state.currencies = parsed;
                        localStorage.setItem('ios_budget_currencies', JSON.stringify(parsed));
                    }
                }
            } catch (e) {
                console.error("Failed to patch currencies", e);
            }
            
            initHeaderSelectors();
            render();
        };
    </script>
</body>
</html>
