        iOS (iPhone / iPad) 加入主畫面專用 PWA 增增設定
        ========================================== -->

    <meta name="apple-mobile-web-app-title" content="WalletWatch">
    
    <!-- 2. 開啟全螢幕 Web App 模式 (隱藏 Safari 網址列，宛如原生 APP) -->
    <meta name="apple-mobile-web-app-capable" content="yes">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700..950;1,700..950&family=Plus+Jakarta+Sans:wght@700;800;950&display=swap" rel="stylesheet">
    <style>
        /* ==========================================
           PWA 專用原生級防回彈、防抖動鎖定設定
           ========================================== */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed; /* 徹底鎖定最外層視窗，阻止 iOS Safari 拖動回彈造成導覽列晃動 */
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #FAF7F2; /* 手機端完美融合 App 背景底色 */
        }
        
        @media (min-width: 640px) {
            html, body {
                background-color: #EBE7E0; /* 電腦模擬機身外側底色 */
                position: relative; /* 桌面端允許相對定位，避免某些預覽環境折疊高度 */
                overflow: auto; /* 桌面端若視窗太扁可滾動主體 */
            }
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            overscroll-behavior-y: none; /* 雙重鎖定防回彈 */
        }
        
        .font-serif { font-family: 'Playfair Display', serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 修正加入主畫面後的 iOS 安全區適配，避免導覽列被 Home Indicator 遮擋（將安全襯距向上調高，防遮擋，並微調更靠近底線） */
        .safe-bottom {
            padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)) !important;
        }
        
        /* iOS 原生級滾動襯距：最佳化縮小頂部留白，緊湊且避開狀態列與瀏海 */
        .custom-pt-top {
            padding-top: calc(8px + env(safe-area-inset-top, 0px));
        }
        
        @media (min-width: 640px) {
            .custom-pt-top {
                padding-top: 48px !important; /* 電腦模擬機身時，避開模擬瀏海高度 */
            }
        }
        
        #main-scroll-container {
            padding-bottom: 40px !important; /* 微調最底端元件的舒適呼吸空間 */
            overscroll-behavior-y: contain; /* 滾動不傳遞至 body */
            -webkit-overflow-scrolling: touch; /* 啟用 iOS 絲滑滾動 */
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translate(-50%, -10px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
        .animate-fade-in-down {
            animation: fadeInDown 0.25s ease-out forwards;
        }
    </style>
</head>

    <script>
        // --- 預設與初始資料 (已補上韓幣 KRW ₩) ---
        const DEFAULT_CURRENCIES = [
            { code: 'TWD', symbol: 'NT$', rateToBase: 1, name: '新台幣' },

            { id: 'card-2', name: '富邦 J 卡', bank: '台北富邦' },

        ];

        const DEFAULT_CATEGORIES = {
            expense: {
                '飲食': { icon: 'dining', color: 'bg-[#F5EBE6] text-[#6E5A4F] border-[#E8DDD5]', sub: [{ name: '早餐', icon: '🍳' }, { name: '午餐', icon: '🍱' }, { name: '晚餐', icon: '🍜' }, { name: '下午茶', icon: '☕' }] },
                '交通': { icon: 'transport', color: 'bg-[#EFEFEE] text-[#555555] border-[#E0E0DF]', sub: [{ name: '捷運/公車', icon: '🚇' }, { name: '計程車', icon: '🚕' }, { name: '加油', icon: '⛽' }] },
                '娛樂': { icon: 'entertainment', color: 'bg-[#F0EAE1] text-[#7A6B58] border-[#E2D9CD]', sub: [{ name: '電影', icon: '🍿' }, { name: '遊戲/網購', icon: '🎮' }, { name: '旅行', icon: '✈️' }] },
                '醫藥': { icon: 'medical', color: 'bg-[#ECEDE8] text-[#5B604D] border-[#DDDFD5]', sub: [{ name: '看診', icon: '🏥' }, { name: '保健品', icon: '🌿' }] },
                '服裝': { icon: 'clothing', color: 'bg-[#F3EBE9] text-[#7E5C54] border-[#E6D7D3]', sub: [{ name: '衣服', icon: '👚' }, { name: '鞋包', icon: '👟' }] },
                '美妝': { icon: 'beauty', color: 'bg-[#F5ECEF] text-[#865F6C] border-[#E9D7DC]', sub: [{ name: '保養品', icon: '🧴' }, { name: '彩妝', icon: '💅' }] },
                '居家': { icon: 'home', color: 'bg-[#F2ECE4] text-[#735A42] border-[#E4D9CE]', sub: [{ name: '房租/房貸', icon: '🏠' }, { name: '水電瓦斯', icon: '⚡' }, { name: '居家修繕', icon: '🛠️' }, { name: '家具家飾', icon: '🛋️' }] },
                '其他': { icon: 'others', color: 'bg-[#F4F1EC] text-[#6C6962] border-[#E5E1D8]', sub: [{ name: '日常雜雜', icon: '🧹' }, { name: '手機費', icon: '📱' }] }
            },
            income: {
                '收入': { icon: 'income', color: 'bg-[#EAF2ED] text-[#5A8F76] border-[#D5E6DC]', sub: [{ name: '正職薪資', icon: '💼' }, { name: '兼職/外快', icon: '🪙' }, { name: '投資回報', icon: '📈' }] }
            }
        };

        function getInitialTransactions() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const formatMonth = (m) => `${year}-${String(m).padStart(2, '0')}`;
            
            return [
                { id: 'tx-1', date: `${formatMonth(month)}-01`, type: 'income', majorCategory: '收入', subCategory: '正職薪資', amount: 45000, currency: 'TWD', paymentMethod: '現金', note: '本月薪資入帳' },
                { id: 'tx-2', date: `${formatMonth(month)}-07`, type: 'expense', majorCategory: '飲食', subCategory: '下午茶', amount: 110, currency: 'TWD', paymentMethod: '現金', note: '與朋友聚餐咖啡' },
                { id: 'tx-3', date: `${formatMonth(month)}-07`, type: 'expense', majorCategory: '交通', subCategory: '捷運/公車', amount: 110, currency: 'TWD', paymentMethod: '現金', note: '通勤加值' },
                { id: 'tx-4', date: `${formatMonth(month)}-05`, type: 'expense', majorCategory: '服裝', subCategory: '衣服', amount: 1200, currency: 'TWD', paymentMethod: '國泰 CUBE 卡', note: '買夏日防曬外套' },
                { id: 'tx-5', date: `${formatMonth(month)}-06`, type: 'expense', majorCategory: '美妝', subCategory: '保養品', amount: 1500, currency: 'TWD', paymentMethod: '中信 LINE Pay 卡', note: '保濕精華液' },
                { id: 'tx-pre-1', date: `${formatMonth(month === 1 ? 12 : month - 1)}-10`, type: 'expense', majorCategory: '飲食', subCategory: '晚餐', amount: 3500, currency: 'TWD', paymentMethod: '富邦 J 卡', note: '高檔燒肉慶生' },
                { id: 'tx-pre-2', date: `${formatMonth(month === 1 ? 12 : month - 1)}-15`, type: 'expense', majorCategory: '娛樂', subCategory: '旅行', amount: 8000, currency: 'TWD', paymentMethod: '國泰 CUBE 卡', note: '兩天一夜小旅行' },
                { id: 'tx-pre-3', date: `${formatMonth(month === 1 ? 12 : month - 1)}-01`, type: 'income', majorCategory: '收入', subCategory: '正職薪資', amount: 45000, currency: 'TWD', paymentMethod: '現金', note: '上月薪資入帳' },
                { id: 'tx-pre2-1', date: `${formatMonth(month <= 2 ? (month === 2 ? 12 : 11) : month - 2)}-05`, type: 'expense', majorCategory: '飲食', subCategory: '午餐', amount: 4200, currency: 'TWD', paymentMethod: '現金', note: '日常飲食累計' },
                { id: 'tx-pre2-2', date: `${formatMonth(month <= 2 ? (month === 2 ? 12 : 11) : month - 2)}-18`, type: 'expense', majorCategory: '美妝', subCategory: '彩妝', amount: 2600, currency: 'TWD', paymentMethod: '中信 LINE Pay 卡', note: '專櫃粉底液' }
            ];
        }

        // --- 全域應用狀態 (追加 selectedDay 儲存當日選定) ---
        window.state = {
            transactions: JSON.parse(localStorage.getItem('ios_budget_transactions')) || getInitialTransactions(),
            categories: JSON.parse(localStorage.getItem('ios_budget_categories')) || DEFAULT_CATEGORIES,
            creditCards: JSON.parse(localStorage.getItem('ios_budget_credit_cards')) || DEFAULT_CREDIT_CARDS,
            currencies: JSON.parse(localStorage.getItem('ios_budget_currencies')) || DEFAULT_CURRENCIES,
            baseCurrencyCode: 'TWD',
            currentTab: 'dashboard',
            selectedMonth: `${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, '0')}`,
            selectedDay: '', // 當前選定的月曆日期 
            
            // 記帳狀態 (支援算式)
            txType: 'expense',
            txMajorCategory: '飲食',
            txSubCategory: '早餐',
            txAmount: '',
            txCurrency: 'TWD',
            txPaymentMethod: '現金',
            txDate: new Date().toISOString().split('T')[0],
            txNote: '',

            // 修改交易狀態
            editingTx: null,

            // 分類建立與修改狀態
            editingMajorType: 'expense',
            editingMajorCat: '飲食',
            newSubName: '',
            newSubIcon: '✨',

            // 信用卡與匯率移轉狀態
            newCardName: '',
            newCardBank: '',
            showMigrationGuide: false,
            importString: ''
        };

        // 💡 解決下拉選單 Year 改變之處理函式
        window.handleYearChange = function(year) {
            const currentMonth = window.state.selectedMonth.split('-')[1];
            window.state.selectedMonth = `${year}-${currentMonth}`;
            showToast(`已載入 ${year} 年記帳資料`, 'info');
            render();
        };

        // 💡 解決下拉選單 Month 改變之處理函式
        window.handleMonthChange = function(month) {
            const currentYear = window.state.selectedMonth.split('-')[0];
            window.state.selectedMonth = `${currentYear}-${month}`;
            showToast(`已切換至 ${month} 月明細`, 'success');
            render();
        };

        // --- 儲存狀態至 LocalStorage ---
        function saveState() {
            localStorage.setItem('ios_budget_transactions', JSON.stringify(window.state.transactions));
            localStorage.setItem('ios_budget_categories', JSON.stringify(window.state.categories));
            localStorage.setItem('ios_budget_credit_cards', JSON.stringify(window.state.creditCards));
            localStorage.setItem('ios_budget_currencies', JSON.stringify(window.state.currencies));
        }

        // --- 安全算式解析運算器 (修復：修正空正規表示式 replace(//g) 與特殊減號取代邏輯) ---
        function safeEval(str) {
            if (!str) return 0;
            // 轉化運算元，支援各代碼中鍵盤之特規乘號與除號、減號等 (已將非法的 //g 完整替換為可正確執行的特殊減號正則 /−/g)
            let sanitized = str.replace(/✕/g, '*').replace(/÷/g, '/').replace(/×/g, '*').replace(/&times;/g, '*').replace(/−/g, '-');
            // 驗證只允許算術運算與數字組合
            if (!/^[0-9\s.+\-*/]*$/.test(sanitized)) return null;
            try {
                let res = new Function(`return (${sanitized})`)();
                if (typeof res === 'number' && isFinite(res)) {
                    return res;
                }
                return null;
            } catch(e) {
                return null;
            }
        }

        // --- 計算與轉換 Utility 函式 (關鍵修復：匯率換算成台幣時，有小數點無條件進位四捨五入成無小數點之整數) ---
        function convertToBase(amount, fromCurrencyCode) {
            const fromCurr = window.state.currencies.find(c => c.code === fromCurrencyCode);
            const baseCurrency = window.state.currencies.find(c => c.code === window.state.baseCurrencyCode) || window.state.currencies[0];
            if (!fromCurr || !baseCurrency) return amount;
            
            let valInBase = (amount * fromCurr.rateToBase) / baseCurrency.rateToBase;
            
            // 核心功能：當目標基準貨幣是 TWD (台幣) 時，有小數點無條件四捨五入進位為整數
            if (baseCurrency.code === 'TWD') {
                return Math.round(valInBase);
            }
            return valInBase;
        }

        // --- 格式化金額輸出 (修復：台幣 TWD 強制顯示為無小數之整數) ---
        function formatAmount(amount, currencyCode, showSymbol = true) {
            const curr = window.state.currencies.find(c => c.code === currencyCode);
            const symbol = curr ? curr.symbol : '$';
            // 台幣強制零小數位，外幣則保留最多兩位
            const decimals = currencyCode === 'TWD' ? 0 : 2;
            const formatted = Number(amount).toLocaleString('zh-TW', { 
                minimumFractionDigits: 0, 
                maximumFractionDigits: decimals 
            });
            return showSymbol ? `${symbol} ${formatted}` : formatted;
        }

        // --- 格式化基本金額 ---
        function formatBaseAmount(amount) {
            return formatAmount(amount, window.state.baseCurrencyCode);
        }

        function getAmountFontSize(length) {
            length = length || 1;
            if (length <= 6) return '3.2rem';
            const dynamicSize = 3.2 - (length - 6) * 0.15;
            return `${Math.max(1.6, dynamicSize)}rem`;
        }

        // --- Toast 提示功能 (修復：補回被遺漏定義的 showToast 函式) ---
        function showToast(message, type = 'success') {
            const toastEl = document.getElementById('toast');
            if (!toastEl) return;
            const icon = type === 'success' ? '✨' : type === 'error' ? '⚡' : '💡';
            toastEl.innerHTML = `
                <span class="text-base">${icon}</span>
                <p class="text-xs font-black">${message}</p>
            `;
            toastEl.classList.remove('hidden');
            setTimeout(() => {
                toastEl.classList.add('hidden');
            }, 3500);
        }
        window.showToast = showToast;

        // --- 核心記憶與重置滾動位置、防止大類按鈕點擊跳動之核心引擎 ---
        function render() {
            // 💡 核心優化：渲染前，先記憶記錄目前滾動容器的捲動位置
            const scrollContainer = document.getElementById('main-scroll-container');
            const savedScrollTop = scrollContainer ? scrollContainer.scrollTop : 0;

            const editModal = document.getElementById('edit-modal');
            // 💡 修正：尋找彈出視窗內實際滾動的那一層 div (.overflow-y-auto) 記憶其高度
            const editScrollContainer = editModal ? editModal.querySelector('.overflow-y-auto') : null;
            const savedEditScrollTop = editScrollContainer ? editScrollContainer.scrollTop : 0;

            // 更新導覽列啟動狀態 (5欄完全平鋪對齊)
            const tabs = ['dashboard', 'history', 'add', 'categories', 'settings'];
            tabs.forEach(tab => {
                const button = document.getElementById(`tab-${tab}`);
                if (!button) return;
                const wrapper = button.querySelector('.tab-icon-wrapper');
                if (!wrapper) return;
                
                if (tab === window.state.currentTab) {
                    button.className = "flex flex-col items-center gap-1 transition-all duration-150 cursor-pointer scale-105 font-black text-[#4A3C31]";
                    wrapper.className = "p-1.5 rounded-full bg-[#4A3C31]/10 tab-icon-wrapper";
                    wrapper.innerHTML = getTabIcon(tab, true);
                } else {
                    button.className = "flex flex-col items-center gap-1 transition-all duration-150 cursor-pointer text-slate-400 font-bold";
                    wrapper.className = "p-1.5 rounded-full bg-transparent tab-icon-wrapper";
                    wrapper.innerHTML = getTabIcon(tab, false);
                }
            });

            // 確保選單值正確同步
            const [selectedY, selectedM] = window.state.selectedMonth.split('-');
            if (document.getElementById('header-year-select')) {
                document.getElementById('header-year-select').value = selectedY;
            }
            if (document.getElementById('header-month-select')) {
                document.getElementById('header-month-select').value = selectedM;
            }

            // 渲染特定 Tabs
            const viewContainer = document.getElementById('view-container');
            const activeTab = window.state.currentTab;

            if (activeTab === 'dashboard') {
                renderDashboard(viewContainer);
            } else if (activeTab === 'add') {
                renderAdd(viewContainer);
            } else if (activeTab === 'history') {
                renderHistory(viewContainer);
            } else if (activeTab === 'categories') {
                renderCategories(viewContainer);
            } else if (activeTab === 'settings') {
                renderSettings(viewContainer);
            }

            // 同步修改視窗 (Edit Sheet)
            renderEditModal();

            // 💡 核心優化：渲染完成後，立即精準同步恢復滾動高度，防止頁面跳動
            if (scrollContainer) {
                scrollContainer.scrollTop = savedScrollTop;
            }
            // 💡 修正：恢復剛剛被重建的彈出視窗內部之滾動高度
            const newEditScrollContainer = editModal ? editModal.querySelector('.overflow-y-auto') : null;
            if (newEditScrollContainer) {
                newEditScrollContainer.scrollTop = savedEditScrollTop;
            }
        }

        // ==========================================
        // TAB 1: 儀表板首頁 (DASHBOARD)
        // ==========================================
        function renderDashboard(container) {
            const filtered = window.state.transactions.filter(tx => tx.date.startsWith(window.state.selectedMonth));
            
            // 1. 本月統計數字
            let expenseTotal = 0;
            let incomeTotal = 0;
            filtered.forEach(tx => {
                const converted = convertToBase(tx.amount, tx.currency);
                if (tx.type === 'expense') {
                    expenseTotal += converted;
                } else {
                    incomeTotal += converted;
                }
            });
            const balance = incomeTotal - expenseTotal;

            // 2. 歷史月度消費對比 (修正：僅顯示當前選擇年份的月度資料，使點選某年時此處只會出現該年份的數據)
            const currentSelectedYear = window.state.selectedMonth.split('-')[0];
            const trend = {};
            window.state.transactions.forEach(tx => {
                if (tx.type === 'expense' && tx.date.startsWith(currentSelectedYear)) {
                    const month = tx.date.substring(0, 7); // "YYYY-MM"
                    const converted = convertToBase(tx.amount, tx.currency);
                    trend[month] = (trend[month] || 0) + converted;
                }
            });
            
            const monthlyTrendStats = Object.entries(trend)
                .map(([month, amount]) => ({ month, amount }))
                .sort((a, b) => b.month.localeCompare(a.month))
                .slice(0, 5);

            const maxMonthlySpend = monthlyTrendStats.length > 0 ? Math.max(...monthlyTrendStats.map(m => m.amount), 1) : 1;

            // 3. 類別佔比
            const summary = {};
            Object.keys(window.state.categories.expense).forEach(cat => {
                summary[cat] = { amount: 0, percentage: 0, colorClass: window.state.categories.expense[cat].color, icon: window.state.categories.expense[cat].icon };
            });

            filtered.forEach(tx => {
                if (tx.type === 'expense') {
                    const converted = convertToBase(tx.amount, tx.currency);
                    if (summary[tx.majorCategory]) {
                        summary[tx.majorCategory].amount += converted;
                    }
                }
            });

            const categoryExpenses = Object.entries(summary)
                .map(([name, data]) => ({ name, ...data }))
                .filter(c => c.amount > 0)
                .sort((a, b) => b.amount - a.amount);

            let totalCategorySpend = categoryExpenses.reduce((sum, c) => sum + c.amount, 0);
            categoryExpenses.forEach(c => {
                if (totalCategorySpend > 0) {
                    c.percentage = Math.round((c.amount / totalCategorySpend) * 100);
                }
            });

            // SVG 甜甜圈圓餅圖生成
            let accumPercentage = 0;
            const colors = ['#4A3C31', '#8A7B70', '#BCA38D', '#D2C5B4', '#A39385', '#E6DFD5'];
            const segments = categoryExpenses.map((cat, idx) => {
                const percentage = cat.percentage;
                const start = accumPercentage;
                accumPercentage += percentage;
                return {
                    name: cat.name,
                    percentage,
                    start,
                    color: colors[idx % colors.length]
                };
            });

            let circlesHTML = `<circle cx="18" cy="18" r="15.915" fill="none" stroke="#FAF7F2" stroke-width="4"></circle>`;
            segments.forEach(segment => {
                const strokeDasharray = `${segment.percentage} ${100 - segment.percentage}`;
                const strokeDashoffset = 100 - segment.start;
                circlesHTML += `<circle cx="18" cy="18" r="15.915" fill="none" stroke="${segment.color}" stroke-width="4" stroke-dasharray="${strokeDasharray}" stroke-dashoffset="${strokeDashoffset}" class="transition-all duration-500"></circle>`;
            });

            const spendingRate = incomeTotal > 0 ? Math.round((expenseTotal / incomeTotal) * 100) : 100;

            // 4. 信用卡累積消費
            const cardTotals = {};
            window.state.creditCards.forEach(card => {
                cardTotals[card.name] = { id: card.id, bank: card.bank, amount: 0, txCount: 0 };
            });
            let creditCardTotal = 0;
            filtered.forEach(tx => {
                if (tx.type === 'expense' && tx.paymentMethod !== '現金') {
                    const converted = convertToBase(tx.amount, tx.currency);
                    if (cardTotals[tx.paymentMethod]) {
                        cardTotals[tx.paymentMethod].amount += converted;
                        cardTotals[tx.paymentMethod].txCount += 1;
                        creditCardTotal += converted;
                    }
                }
            });
            const activeCards = Object.entries(cardTotals).map(([name, data]) => ({ name, ...data }));

            // --- 歷史對比 HTML 區塊 ---
            let trendRowsHTML = '';
            if (monthlyTrendStats.length === 0) {
                trendRowsHTML = `
                    <div class="text-center py-6 text-[#8A7B70]">
                        <span class="text-2xl">📊</span>
                        <p class="text-[11.5px] font-black mt-1">此年份尚無消費數據</p>
                    </div>`;
            } else {
                monthlyTrendStats.forEach(stat => {
                    const barPercentage = Math.round((stat.amount / maxMonthlySpend) * 100);
                    const isCurrentSelected = stat.month === window.state.selectedMonth;
                    const displayMonth = stat.month.replace('-', ' / ');
                    
                    trendRowsHTML += `
                        <div onclick="selectTrendMonth('${stat.month}')" class="group p-2.5 rounded-2xl border transition-all duration-500 cursor-pointer flex flex-col gap-1.5 ${isCurrentSelected ? 'bg-[#FAF7F2] border-[#4A3C31]' : 'bg-transparent border-transparent hover:bg-slate-50'}">
                            <div class="flex items-center justify-between text-xs font-black">
                                <span class="${isCurrentSelected ? 'text-[#4A3C31]' : 'text-[#8A7B70]'} flex items-center gap-1.5">
                                    ${displayMonth}
                                    ${isCurrentSelected ? '<span class="text-[8px] bg-[#4A3C31] text-[#FAF7F2] px-1.5 py-0.25 rounded font-black">當前選擇</span>' : ''}
                                </span>
                                <span class="text-[#4A3C31]">${formatBaseAmount(stat.amount)}</span>
                            </div>
                            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                                <div class="h-full rounded-full transition-all duration-500 ${isCurrentSelected ? 'bg-[#4A3C31]' : 'bg-[#BCA38D] group-hover:bg-[#8A7B70]'}" style="width: ${Math.max(4, barPercentage)}%"></div>
                            </div>
                        </div>`;
                });
            }

            // --- 類別佔比 HTML 區塊 ---
            let categoryListHTML = '';
            if (categoryExpenses.length === 0 || categoryExpenses.every(c => c.amount === 0)) {
                // 💡 修正細節：將原本的「本月尚無 any 支出記錄」更新為「本月尚無任何支出紀錄」
                categoryListHTML = `
                    <div class="text-center py-8 text-[#8A7B70] w-full">
                        <span class="text-3xl">☕</span>
                        <p class="text-xs mt-1.5 font-bold">本月尚無任何支出紀錄</p>
                    </div>`;
            } else {
                categoryListHTML = `
                    <div class="flex items-center gap-4 w-full">
                        <div class="w-24 h-24 shrink-0 relative">
                            <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                                ${circlesHTML}
                            </svg>
                            <div class="absolute inset-0 flex flex-col items-center justify-center">
                                <span class="text-[9px] font-black text-[#8A7B70] leading-none">支出率</span>
                                <span class="text-sm font-black text-[#4A3C31]">${spendingRate}%</span>
                            </div>
                        </div>
                        <div class="flex-1 space-y-2">`;
                categoryExpenses.forEach((cat, idx) => {
                    const colorLabel = colors[idx % colors.length];
                    categoryListHTML += `
                            <div class="flex items-center justify-between text-xs">
                                <!-- 💡 核心修改：將比率 (cat.percentage%) 改為顯示在分類名稱文字的後面 -->
                                <div class="flex items-center gap-1.5 font-bold text-[#8A7B70]">
                                    <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${colorLabel}"></span>
                                    <span>${cat.name} (${cat.percentage}%)</span>
                                </div>
                                <!-- 💡 核心修改：將消費總金額放在最右邊 -->
                                <span class="font-black text-[#362C24]">${formatBaseAmount(cat.amount)}</span>
                            </div>`;
                });
                categoryListHTML += `</div></div>`;
            }

            // --- 信用卡累積消費 HTML (與您設計之暖棕大地色系實體質感 mini 信用卡 Icon 完美置中融合) ---
            let cardsHTML = '';
            activeCards.forEach(card => {
                cardsHTML += `
                    <div class="flex items-center justify-between p-2.5 rounded-2xl bg-[#FAF7F2] border border-[#E6DFD5]/50">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-full bg-[#5C4D42] flex items-center justify-center shadow-sm shrink-0">
                                <svg viewBox="0 0 24 16" class="w-6 h-4 select-none">
                                    <defs>
                                        <linearGradient id="goldCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                            <stop offset="0%" stop-color="#F4EAE1" />
                                            <stop offset="40%" stop-color="#D2C5B4" />
                                            <stop offset="100%" stop-color="#9C8B7C" />
                                        </linearGradient>
                                    </defs>
                                    <rect width="24" height="16" rx="2" fill="url(#goldCardGrad)" />
                                    <rect x="0" y="2" width="24" height="3" fill="#1C1816" />
                                    <rect x="2" y="7" width="13" height="4" fill="#FAF7F2" rx="0.5" opacity="0.9" />
                                    <path d="M 3 9 C 5 8.2 6.5 10.2 8.5 9 C 10.5 7.8 11.5 10 13 8.5" stroke="#2563EB" stroke-width="0.6" fill="none" stroke-linecap="round" />
                                    <rect x="17.5" y="7" width="4.5" height="3.5" rx="0.5" fill="#D4AF37" />
                                    <rect x="18.5" y="8" width="2.5" height="1.5" rx="0.2" fill="none" stroke="#FAF7F2" stroke-width="0.3" />
                                    <rect x="2" y="12.5" width="1.5" height="1" fill="#FAF7F2" opacity="0.7" rx="0.1" />
                                    <rect x="4.5" y="12.5" width="1.5" height="1" fill="#FAF7F2" opacity="0.7" rx="0.1" />
                                    <rect x="7" y="12.5" width="1.5" height="1" fill="#FAF7F2" opacity="0.7" rx="0.1" />
                                    <rect x="9.5" y="12.5" width="1.5" height="1" fill="#FAF7F2" opacity="0.7" rx="0.1" />
                                </svg>
                            </div>
                            <div>

                    </div>

                    <button type="button" onclick="submitAddTx()" class="w-full py-3 rounded-2xl font-black text-white text-xs shadow-lg transition-all transform active:scale-95 bg-[#4A3C31] hover:bg-[#342921]">
                        確認送出此筆交易
                    </button>
                </div>`;
        }

        window.setAddTxType = function(type) {
            window.state.txType = type;
            const keys = Object.keys(window.state.categories[type]);
            window.state.txMajorCategory = keys[0] || '';
            // 💡 核心修復：修正成取得 txMajorCategory 之下的子分類，解決因變數引用錯誤（原先錯用為 editingMajorCat）造成的清單凍結問題。
            const subList = window.state.categories[type][window.state.txMajorCategory]?.sub || [];
            window.state.txSubCategory = subList[0]?.name || '';
            render();
        };

        window.setAddMajorCategory = function(cat) {
            window.state.txMajorCategory = cat;
            const subList = window.state.categories[window.state.txType][cat]?.sub || [];
            window.state.txSubCategory = subList[0]?.name || '';
            render();
        };

        window.setAddSubCategory = function(sub) {
            window.state.txSubCategory = sub;
            render();
        };

        window.setAddTxCurrency = function(currency) {
            window.state.txCurrency = currency;
            render();
        };

        window.setAddTxDate = function(dateStr) {
            window.state.txDate = dateStr;
        };

        window.setAddTxPaymentMethod = function(method) {
            window.state.txPaymentMethod = method;
        };

        window.setAddTxNote = function(note) {
            window.state.txNote = note;
        };

        // --- 鍵盤輸入邏輯 ---
        window.handleCalcInput = function(value) {
            let current = window.state.txAmount.toString();
            const operators = ['+', '-', '*', '/'];
            
            if (value === 'backspace') {
                current = current.length <= 1 ? '' : current.slice(0, -1);
            } else if (value === 'clear') {
                current = '';
            } else if (value === '=') {
                let res = safeEval(current);
                if (res !== null) {
                    // 如果計算結果之目標是台幣，則強制防制小數四捨五入進位為整數
                    if (window.state.txCurrency === 'TWD') {
                        current = Math.round(res).toString();
                    } else {
                        current = Number(res.toFixed(2)).toString();
                    }
                } else {
                    showToast('算式不完整，無法計算！', 'error');
                    return;
                }
            } else if (operators.includes(value)) {
                if (current === '') {
                    if (value === '-') current = '-';
                    else return;
                } else {
                    let lastChar = current.slice(-1);
                    if (operators.includes(lastChar)) {
                        current = current.slice(0, -1) + value;
                    } else {
                        current += value;
                    }
                }
            } else if (value === '.') {
                let segments = current.split(/[\+\-\*\/]/);
                let activeSegment = segments[segments.length - 1] || '';
                if (activeSegment.includes('.')) return;
                
                if (current === '' || operators.includes(current.slice(-1))) {
                    current += '0.';
                } else {
                    current += '.';
                }
            } else {
                if (current === '0') {
                    current = value.toString();
                } else {
                    current += value.toString();
                }
            }
            window.state.txAmount = current;
            render();
        };

        // --- 確認送出記帳 (修復：送出前若有算式，自動完成計算並進位) ---
        window.submitAddTx = function() {
            let finalAmountStr = window.state.txAmount.toString();
            let evaluated = safeEval(finalAmountStr);
            
            if (finalAmountStr === '' || evaluated === null) {
                showToast('算式不完整或格式錯誤！請重新確認。', 'error');
                return;
            }
            
            // 匯率換算成台幣時進位成沒有小數點之整數
            if (window.state.txCurrency === 'TWD') {
                evaluated = Math.round(evaluated);
            } else {
                evaluated = Number(evaluated.toFixed(2));
            }
            
            if (evaluated <= 0) {
                showToast('記帳金額必須大於 0 元！', 'error');
                return;
            }
            if (!window.state.txSubCategory) {
                showToast('請選擇合適的小分類！', 'error');
                return;
            }

            const newTx = {
                id: `tx-${Date.now()}`,
                date: window.state.txDate,
                type: window.state.txType,
                majorCategory: window.state.txMajorCategory,
                subCategory: window.state.txSubCategory,
                amount: evaluated,
                currency: window.state.txCurrency,
                paymentMethod: window.state.txType === 'income' ? '現金' : window.state.txPaymentMethod,
                note: window.state.txNote.trim()
            };

            window.state.transactions.unshift(newTx);
            saveState();
            
            window.state.txAmount = '';
            window.state.txNote = '';
            showToast('交易已成功登錄！');
            
            switchTab('dashboard');
        };

        // ==========================================
        // TAB 3: 歷史明細與篩選 (HISTORY) -> 🎛️ 升級為互動式大氣大地色月曆視圖 🎛️
        // ==========================================
        function renderHistory(container) {
            if (!window.state.filterType) window.state.filterType = 'all';
            if (!window.state.filterPayment) window.state.filterPayment = 'all';

            const [year, month] = window.state.selectedMonth.split('-');
            const yearNum = parseInt(year);
            const monthNum = parseInt(month);
            const monthStr = String(monthNum).padStart(2, '0');

            // 💡 邏輯保護：若無選定當日、或月份不符合當前月份，則動態同步今天或當月1號
            if (!window.state.selectedDay || !window.state.selectedDay.startsWith(window.state.selectedMonth)) {
                const today = new Date();
                const todayStr = today.toISOString().split('T')[0];
                if (todayStr.startsWith(window.state.selectedMonth)) {
                    window.state.selectedDay = todayStr;
                } else {
                    window.state.selectedDay = `${window.state.selectedMonth}-01`;
                }
            }

            // 計算月曆網格資料
            const firstDay = new Date(yearNum, monthNum - 1, 1);
            const startDayOfWeek = firstDay.getDay(); // 0 = Sun, 1 = Mon...
            const totalDays = new Date(yearNum, monthNum, 0).getDate();

            // 1. 篩選控制項
            let cardOptions = '';
            window.state.creditCards.forEach(c => {
                cardOptions += `<option value="${c.name}" ${c.name === window.state.filterPayment ? 'selected' : ''}>${c.name}</option>`;
            });

            let filterHeaderHTML = `
                <div class="bg-white p-4 rounded-3xl border border-[#E6DFD5] shadow-sm space-y-3">
                    <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                        <span class="text-xs font-black text-slate-700 flex items-center gap-1">
                            <span>🔍</span> 篩選帳目
                        </span>
                        <input
                            type="month"
                            value="${window.state.selectedMonth}"
                            onchange="setSelectedMonthFromHistory(this.value)"
                            class="px-2.5 py-1 text-xs bg-[#FAF7F2] border-[#E6DFD5] rounded-lg text-[#4A3C31] font-black"

                            <option value="all" ${window.state.filterType === 'all' ? 'selected' : ''}>所有類型</option>
                            <option value="expense" ${window.state.filterType === 'expense' ? 'selected' : ''}>支出明細</option>
                            <option value="income" ${window.state.filterType === 'income' ? 'selected' : ''}>收入明細</option>
                        </select>

                        <select onchange="setHistoryFilter('payment', this.value)" class="px-2 py-1.5 text-[10px] bg-[#FAF7F2] border-[#E6DFD5] rounded-lg text-slate-700 font-black focus:outline-none">
                            <option value="all" ${window.state.filterPayment === 'all' ? 'selected' : ''}>所有付款</option>

            // 2. 月度日曆主格柵 (日 一 二 三 四 五 六)

            let calendarWeeksHTML = weekdays.map(day => `
                <div class="text-center text-[10px] font-black text-[#8A7B70] py-1">${day}</div>
            `).join('');

            // 填充前置空天數
            for (let i = 0; i < startDayOfWeek; i++) {
                calendarWeeksHTML += `<div class="aspect-square bg-transparent"></div>`;
            }

            // 填充實際日子
            for (let d = 1; d <= totalDays; d++) {
                const dayStr = `${yearNum}-${monthStr}-${String(d).padStart(2, '0')}`;
                const isSelected = window.state.selectedDay === dayStr;

                // 搜尋當日所有登載交易
                const dayTxs = window.state.transactions.filter(tx => tx.date === dayStr);
                
                // 套用使用者啟動之 Type & Payment 篩選條件
                const matchingTxs = dayTxs.filter(tx => {
                    const matchType = window.state.filterType === 'all' ? true : tx.type === window.state.filterType;
                    const matchPayment = window.state.filterPayment === 'all' ? true : tx.paymentMethod === window.state.filterPayment;
                    return matchType && matchPayment;
                });

                // 計算當日圓點屬性 (紅色=有支出, 綠色=有收入, 橘色=雙重並存)
                let dayIndicatorHTML = '';
                if (matchingTxs.length > 0) {
                    let hasExpense = false;
                    let hasIncome = false;
                    matchingTxs.forEach(tx => {
                        if (tx.type === 'expense') hasExpense = true;
                        if (tx.type === 'income') hasIncome = true;
                    });
                    
                    if (hasExpense && hasIncome) {
                        dayIndicatorHTML = `<span class="w-1 h-1 rounded-full bg-amber-500"></span>`; // 雙收支
                    } else if (hasExpense) {
                        dayIndicatorHTML = `<span class="w-1 h-1 rounded-full bg-rose-400"></span>`; // 僅支出
                    } else if (hasIncome) {
                        dayIndicatorHTML = `<span class="w-1 h-1 rounded-full bg-[#5A8F76]"></span>`; // 僅收入
                    }
                }

                // 💡 修正反斜線轉義與不合規範的替換
                calendarWeeksHTML += `
                    <button type="button" onclick="selectCalendarDay('${dayStr}')" class="aspect-square rounded-xl flex flex-col items-center justify-between p-1 text-xs border transition relative cursor-pointer

                            ? 'bg-[#4A3C31] text-[#FAF7F2] border-[#4A3C31] font-black shadow-sm'

                        <div class="flex justify-center gap-0.5 w-full h-1.5 items-center">

                    </button>`;
            }

            let calendarHTML = `

                    <div class="grid grid-cols-7 gap-1">
                        ${calendarWeeksHTML}
                    </div>
                </div>
            `;

            // 3. 渲染選定日期的消費明細
            const selectedDayTxs = window.state.transactions.filter(tx => {
                const matchDay = tx.date === window.state.selectedDay;
                const matchType = window.state.filterType === 'all' ? true : tx.type === window.state.filterType;
                const matchPayment = window.state.filterPayment === 'all' ? true : tx.paymentMethod === window.state.filterPayment;
                return matchDay && matchType && matchPayment;
            });

            let historyListHTML = '';
            selectedDayTxs.forEach(tx => {
                const majorDetails = window.state.categories[tx.type]?.[tx.majorCategory] || { icon: '❓', color: 'bg-gray-100 text-gray-500' };
                const convertedAmount = convertToBase(tx.amount, tx.currency);
                const showSubCurrency = tx.currency !== window.state.baseCurrencyCode;

                historyListHTML += `
                    <div class="flex items-center justify-between p-3 rounded-2xl bg-white border border-[#E6DFD5] shadow-sm hover:scale-[1.01] transition-transform">
                        <div class="flex items-center gap-2.5">
                            <span class="w-9 h-9 rounded-full flex items-center justify-center text-sm ${majorDetails.color} border shadow-sm shrink-0">
                                ${getCategoryIcon(tx.majorCategory)}
                            </span>
                            <div>
                                <div class="flex items-center gap-1">
                                    <p class="font-black text-xs text-[#362C24]">${tx.subCategory}</p>
                                    <span class="text-[8px] bg-slate-100 text-[#8A7B70] px-1 py-0.25 rounded font-black">${tx.paymentMethod}</span>
                                </div>
                                <p class="text-[9px] font-bold text-[#8A7B70] leading-none mt-1">${tx.date} ${tx.note ? `• ${tx.note}` : ''}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="text-right">
                                <!-- 主要顯示換算台幣結果 -->
                                <p class="font-black text-xs ${tx.type === 'expense' ? 'text-[#4A3C31]' : 'text-[#5A8F76]'}">
                                    ${tx.type === 'expense' ? '-' : '+'}${formatBaseAmount(convertedAmount)}
                                </p>
                                <!-- 下方則是原始幣值 -->
                                ${showSubCurrency ? `<p class="text-[8px] font-bold text-[#8A7B70]">原始: ${formatAmount(tx.amount, tx.currency)}</p>` : ''}

                                <button onclick="deleteTx('${tx.id}')" class="w-6 h-6 rounded-lg bg-white border border-rose-100 text-rose-300 hover:text-rose-600 flex items-center justify-center text-[10px] cursor-pointer font-bold transition">✕</button>
                            </div>
                        </div>
                    </div>`;
            });

            const formattedSelectedDay = window.state.selectedDay.replace(/(\d{4})-(\d{2})-(\d{2})/, '$1 年 $2 月 $3 日');

            if (selectedDayTxs.length === 0) {
                // 💡 點擊「無紀錄卡片」直接跳轉至記一筆
                historyListHTML = `
                    <div onclick="linkToAddTabWithDate('${window.state.selectedDay}')" class="text-center py-10 text-[#8A7B70] bg-white rounded-3xl border border-[#E6DFD5] hover:border-[#4A3C31]/30 cursor-pointer transition active:scale-[0.99] select-none">
                        <span class="text-2xl">📭</span>
                        <p class="text-xs mt-1.5 font-black">${formattedSelectedDay} 尚無交易紀錄</p>

                    </div>`;
            } else {
                // 💡 修正：「幾筆項目」因轉義反斜線無法解析渲染的錯誤，改回正常無反斜線之標準變數代入
                historyListHTML = `
                    <div class="space-y-2">
                        <div class="flex items-center justify-between px-1">
                            <span onclick="linkToAddTabWithDate('${window.state.selectedDay}')" class="text-[10px] font-black text-[#8A7B70] hover:text-[#4A3C31] hover:underline cursor-pointer uppercase tracking-widest flex items-center gap-1 select-none">
                                <span>${formattedSelectedDay} 明細</span>
                                <span class="text-[8px] bg-[#4A3C31]/10 text-[#4A3C31] px-1.5 py-0.5 rounded font-black">➕ 記一筆</span>
                            </span>
                            <span class="text-[10px] font-black text-[#4A3C31]">${selectedDayTxs.length} 筆項目</span>
                        </div>
                        ${historyListHTML}
                    </div>

            }

            container.innerHTML = `
                <div class="space-y-4">
                    ${filterHeaderHTML}
                    ${calendarHTML}
                    ${historyListHTML}
                </div>`;
        }

        // 💡 互動輔助函式：切換月份時，自動更新選定日
        window.setSelectedMonthFromHistory = function(value) {
            window.state.selectedMonth = value;
            const today = new Date();
            const todayStr = today.toISOString().split('T')[0];
            if (todayStr.startsWith(value)) {
                window.state.selectedDay = todayStr;
            } else {
                window.state.selectedDay = `${value}-01`;
            }
            render();
        };

        // 💡 互動輔助函式：點擊月曆格子切換日期，流暢恢復滾動不跳動
        window.selectCalendarDay = function(dayStr) {
            window.state.selectedDay = dayStr;
            render();
        };

            if (filterKey === 'payment') window.state.filterPayment = value;
            render();
        };

                                <select onchange="setCategoriesEditType(this.value)" class="px-2 py-1.5 text-xs bg-[#FAF7F2] border border-[#E6DFD5] rounded-lg text-slate-700 font-black focus:outline-none">
                                    <option value="expense" ${window.state.editingMajorType === 'expense' ? 'selected' : ''}>支出類別</option>
                                    <option value="income" ${window.state.editingMajorType === 'income' ? 'selected' : ''}>收入類別</option>
                                </select>

                                <select id="cat-major-select" onchange="setCategoriesEditMajor(this.value)" class="px-2 py-1.5 text-xs bg-[#FAF7F2] border border-[#E6DFD5] rounded-lg text-slate-700 font-black focus:outline-none">
                                    ${majorOptions}
                                </select>
                            </div>

                            <div class="grid grid-cols-3 gap-2">
                                <input type="text" required maxLength="8" placeholder="小分類名稱" value="${window.state.newSubName}" oninput="setNewSubName(this.value)" class="col-span-2 px-3 py-1.5 text-xs bg-[#FAF7F2] border border-[#E6DFD5] rounded-lg text-slate-700 font-bold focus:outline-none">
                                <input type="text" required maxLength="2" placeholder="代表符" value="${window.state.newSubIcon}" oninput="setNewSubIcon(this.value)" class="px-2 py-1.5 text-xs bg-[#FAF7F2] border border-[#E6DFD5] rounded-lg text-center font-black focus:outline-none">

                    <div class="space-y-3">

        // ==========================================
        // TAB 5: 設定與移轉 (SETTINGS)
        // ==========================================
        function renderSettings(container) {
            let cardsListHTML = '';
            window.state.creditCards.forEach(card => {
                cardsListHTML += `
                    <div class="flex items-center justify-between p-2 rounded-xl bg-slate-50 text-[11px] font-bold">
                        <span class="font-black text-[#362C24]">${card.name} (${card.bank})</span>
                        <button onclick="deleteCard('${card.id}', '${card.name}')" class="text-rose-500 hover:underline font-black cursor-pointer">解綁</button>
                    </div>`;
            });

                        </button>

                        <div id="migration-guide" class="${window.state.showMigrationGuide ? '' : 'hidden'} p-3 bg-white rounded-2xl text-[9px] text-[#8A7B70] space-y-1.5 border border-[#E6DFD5] leading-relaxed font-bold">

                            <p>3. 在 <strong>新手機</strong> 開氣網頁，於此頁面點擊【導入備份檔案】讀取即可完成移轉！</p>
                        </div>

                        <div class="grid grid-cols-2 gap-2 pt-1">
                            <button onclick="handleExportData()" class="py-2.5 px-3 bg-white border border-[#E6DFD5] text-[#4A3C31] font-black text-xs rounded-2xl shadow-sm hover:bg-slate-50 active:scale-95 transition cursor-pointer">📦 導出備份檔案</button>
                            <label class="py-2.5 px-3 bg-[#4A3C31] hover:bg-[#342921] text-white font-black text-xs rounded-2xl shadow-sm text-center cursor-pointer active:scale-95 transition block">

                            <div class="flex gap-1.5">
                                <button onclick="copyTransferCode()" class="py-1.5 px-2.5 bg-white border border-[#E6DFD5] text-[#4A3C31] text-[10px] font-black rounded-xl active:scale-95 transition cursor-pointer">複製轉移代碼</button>
                                <span class="text-[9px] font-bold text-[#8A7B70] self-center">複製代碼並發送至新 iPhone 貼上</span>

                            <div class="space-y-1.5 mt-2">
                                <textarea id="import-code-input" placeholder="在新手機上貼上轉移代碼..." class="w-full h-14 p-2 bg-white border border-[#E6DFD5] rounded-xl text-[9px] text-slate-600 focus:outline-none focus:ring-1 focus:ring-[#4A3C31] font-bold"></textarea>
                                <button type="button" onclick="submitImportCode()" class="w-full py-1.5 bg-[#4A3C31] text-white text-[10px] font-black rounded-xl active:scale-95 transition cursor-pointer">確認讀取代碼還原</button>

                    </div>

                    <!-- 信用卡設定 -->
                    <div class="bg-white p-4 rounded-3xl border border-[#E6DFD5] shadow-sm flex flex-col">
                        <h3 class="font-black text-[#4A3C31] text-xs border-b border-slate-100 pb-2 mb-3">💳 綁定新信用卡</h3>
                        <form onsubmit="submitAddCard(event)" class="space-y-2.5">
                            <div class="grid grid-cols-2 gap-2">
                                <input type="text" required id="card-name-input" placeholder="卡片名稱 (如 富邦J卡)" class="w-full px-2.5 py-1.5 bg-[#FAF7F2] border border-[#E6DFD5] rounded-lg text-xs font-bold focus:outline-none">
                                <input type="text" id="card-bank-input" placeholder="發卡銀行 (如 富邦銀行)" class="w-full px-2.5 py-1.5 bg-[#FAF7F2] border border-[#E6DFD5] rounded-lg text-xs font-bold focus:outline-none">

                            <button type="submit" class="w-full py-2 bg-[#4A3C31] hover:bg-[#342921] text-white font-black text-xs rounded-xl shadow-sm transition cursor-pointer">新增信用卡</button>

                        <div class="mt-3.5 space-y-2">
